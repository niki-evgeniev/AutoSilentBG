<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title th:text="#{admin.inquiries.title}">Запитвания - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page">
    <section class="container py-5">
        <div class="section-title text-start">
            <span th:text="#{admin.inquiries.eyebrow}">Комуникация</span>
            <h1 th:text="#{admin.inquiries.heading}">Получени запитвания</h1>
        </div>
        <div class="admin-table-card">
            <div class="table-responsive" th:if="${!inquiries.isEmpty()}">
                <table class="table align-middle admin-orders-table">
                    <thead><tr>
                        <th th:text="#{admin.inquiries.status}">Статус</th>
                        <th th:text="#{admin.inquiries.sender}">Подател</th>
                        <th th:text="#{contact.subject}">Тема</th>
                        <th th:text="#{admin.inquiries.date}">Дата</th>
                        <th th:text="#{admin.inquiries.action}">Действие</th>
                    </tr></thead>
                    <tbody>
                    <tr th:each="inquiry : ${inquiries.content}" th:classappend="${!inquiry.read()} ? 'table-light fw-semibold'">
                        <td>
                            <span th:if="${inquiry.read()}" class="badge text-bg-secondary" th:text="#{admin.inquiries.read}">Прочетено</span>
                            <span th:unless="${inquiry.read()}" class="badge text-bg-danger" th:text="#{admin.inquiries.unread}">Ново</span>
                        </td>
                        <td><strong th:text="${inquiry.name()}">Име</strong><small class="d-block text-muted" th:text="${inquiry.email()}">email</small></td>
                        <td th:text="${inquiry.subject()}">Тема</td>
                        <td th:text="${#temporals.format(inquiry.createdAt(), 'dd.MM.yyyy HH:mm')}">Дата</td>
                        <td><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/inquiries/{id}(id=${inquiry.id()})}">
                            <i class="bi bi-envelope-open me-1"></i><span th:text="#{admin.inquiries.open}">Отвори</span></a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="cart-empty" th:if="${inquiries.isEmpty()}">
                <i class="bi bi-inbox"></i><h2 th:text="#{admin.inquiries.empty}">Няма запитвания</h2>
            </div>
            <nav class="mt-4" th:if="${inquiries.totalPages > 1}" th:aria-label="#{admin.inquiries.pagination}">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${inquiries.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/inquiries(page=${inquiries.number - 1})}" th:text="#{admin.inquiries.previous}">Назад</a>
                    </li>
                    <li class="page-item disabled"><span class="page-link" th:text="|${inquiries.number + 1} / ${inquiries.totalPages}|"></span></li>
                    <li class="page-item" th:classappend="${inquiries.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/inquiries(page=${inquiries.number + 1})}" th:text="#{admin.inquiries.next}">Напред</a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
