<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{forgotPassword.title}">Забравена парола - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-page page-3d">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <section class="auth-form-card auth-3d-card tilt-card text-center">
                    <div class="auth-form-header">
                        <i class="bi bi-key-fill fs-1 text-warning"></i>
                        <h1 class="mt-3" th:text="#{forgotPassword.heading}">Забравена парола?</h1>
                        <p th:text="#{forgotPassword.message}">Възстановяването на парола през сайта ще бъде налично скоро.</p>
                    </div>
                    <div class="alert alert-light border my-4" role="alert">
                        <i class="bi bi-telephone-fill me-2"></i>
                        <span th:text="#{forgotPassword.contact}">За съдействие ни се обадете на</span>
                        <a class="fw-bold ms-1" href="tel:0888123456">0888 123 456</a>
                    </div>
                    <a class="btn-auth-secondary d-block" th:href="@{/user/sign_in}">
                        <i class="bi bi-arrow-left me-2"></i><span th:text="#{forgotPassword.back}">Обратно към вход</span>
                    </a>
                </section>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
