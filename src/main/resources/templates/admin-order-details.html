<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${order.orderNumber()} - AutoSilent|">Поръчка - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" th:href="@{/css/shop.css}" rel="stylesheet">
</head>
<body th:data-currency="#{site.currency}">
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page">
    <section class="container py-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb custom-breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/orders}" th:text="#{admin.orders}">Поръчки</a></li>
                <li class="breadcrumb-item active" th:text="${order.orderNumber()}"></li>
            </ol>
        </nav>

        <div class="admin-order-heading">
            <div><span th:text="#{admin.order.number}">Номер</span>
                <h1 th:text="${order.orderNumber()}"></h1></div>
            <span class="order-status" th:classappend="| status-${#strings.toLowerCase(order.orderStatus().name())}|"
                  th:text="${#messages.msg('order.status.' + order.orderStatus().name())}"></span>
        </div>
        <div class="alert alert-success" th:if="${statusUpdated}" th:text="#{admin.order.updated}">Статусът е обновен.
        </div>

        <div class="admin-order-grid">
            <div>
                <section class="admin-detail-card">
                    <h2 th:text="#{checkout.products}">Продукти</h2>
                    <p class="alert alert-success" th:if="${itemsUpdated == true}" th:text="#{order.edit.success}"></p>
                    <p class="alert alert-danger" th:if="${itemsError != null}" th:text="${itemsError}"></p>
                    <article class="admin-order-item" th:each="item : ${order.items()}">
                        <div class="admin-order-item-image">
                            <img th:if="${item.productImageUrl() != null}" th:src="${item.productImageUrl()}"
                                 th:alt="${item.productName()}">
                            <i th:unless="${item.productImageUrl() != null}" class="bi bi-box-seam"></i>
                        </div>
                        <div><strong th:text="${item.productName()}"></strong><small
                                th:text="${item.productSku()}"></small></div>
                        <span th:text="|${item.quantity()} × ${#messages.msg('product.price', item.unitPrice())}|"></span>
                        <div>
                            <strong th:text="#{product.price(${item.totalPrice()})}"></strong>
                            <form th:if="${itemsEditable == true}" class="mt-2"
                                  th:action="@{/admin/orders/{id}/items/{itemId}/remove(id=${order.id()},itemId=${item.id()})}" method="post"
                                  onsubmit="return confirm(this.dataset.confirmMessage)" th:data-confirm-message="#{order.edit.removeConfirm}">
                                <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{order.edit.remove}">Премахни</button>
                            </form>
                        </div>
                    </article>
                    <form th:if="${itemsEditable == true}" class="border rounded p-3 my-3"
                          th:action="@{/admin/orders/{id}/items/add(id=${order.id()})}" method="post">
                        <h3 class="h6" th:text="#{order.edit.add}">Добави продукт</h3>
                        <label class="form-label" for="orderProduct" th:text="#{admin.productInformation.product}">Продукт</label>
                        <select id="orderProduct" name="productId" class="form-select mb-3" required>
                            <option value="" th:text="#{order.edit.choose}">Изберете продукт</option>
                            <option th:each="choice : ${orderChoices}" th:value="${choice.id()}" th:disabled="${choice.stock() == 0}"
                                    th:text="|${choice.name()} · ${#messages.msg('product.price', choice.price())} · ${#messages.msg('details.available', choice.stock())}|"></option>
                        </select>
                        <label class="form-label" for="orderQuantity" th:text="#{details.quantity}">Количество</label>
                        <input id="orderQuantity" name="quantity" class="form-control mb-3" type="number" min="1" max="2147483647" step="1" value="1" required>
                        <button class="btn btn-orange" type="submit" th:text="#{order.edit.add}">Добави продукт</button>
                    </form>
                    <p class="alert alert-success" th:if="${priceUpdated == true}" th:text="#{order.price.success}"></p>
                    <p class="alert alert-danger" th:if="${priceError != null}" th:text="${priceError}"></p>
                    <div class="admin-order-totals">
                        <div><span th:text="#{admin.order.subtotal}">Междинна сума</span><strong
                                th:text="#{product.price(${order.subtotalPrice()})}"></strong></div>
                        <div><span th:text="#{admin.order.delivery}">Доставка</span><strong
                                th:text="${order.delivery() != null ? #messages.msg('shipping.paidByRecipient') : #messages.msg('product.price', order.deliveryPrice())}"></strong></div>
                        <div class="text-success"
                             th:if="${order.discountPrice() != null and order.discountPrice().signum() > 0}">
                            <span><span th:text="#{admin.order.discount}">Отстъпка</span> (<span
                                    th:text="|${order.discountPercentText()}%|">0%</span>)</span>
                            <strong th:text="|−${#messages.msg('product.price', order.discountPrice())}|"></strong>
                        </div>
                        <div th:if="${order.promoCode() != null}">
                            <span th:text="#{checkout.promoCode}">Промокод</span>
                            <strong th:text="|${order.promoCode()} (${order.promoDiscountPercent()}%)|">CODE</strong>
                        </div>
                        <div class="total"><span th:text="#{cart.total}">Общо</span><strong
                                th:text="#{product.price(${order.totalPrice()})}"></strong></div>
                    </div>
                </section>

                <section sec:authorize="hasRole('ADMIN')" th:if="${itemsEditable == true}" class="admin-detail-card mt-4">
                    <h2 th:text="#{order.price.heading}">Ръчна крайна сума</h2>
                    <p class="small text-muted" th:text="#{order.price.help}"></p>
                    <form th:action="@{/admin/orders/{id}/price(id=${order.id()})}" method="post">
                        <label for="manualOrderTotal" class="form-label" th:text="#{order.price.label}">Крайна сума (€)</label>
                        <input id="manualOrderTotal" class="form-control mb-3" name="total" type="number" inputmode="decimal"
                               step="0.01" th:min="${order.deliveryPrice()}" th:max="${order.subtotalPrice().add(order.deliveryPrice())}"
                               th:value="${order.totalPrice()}" required>
                        <button class="btn btn-orange" type="submit" th:text="#{order.price.save}">Запази сумата</button>
                    </form>
                </section>
                <section class="admin-detail-card mt-4">
                    <h2 th:text="#{admin.order.history}">История</h2>
                    <div class="order-history-entry" th:each="entry : ${order.history()}">
                        <i class="bi bi-clock-history"></i>
                        <div><strong th:text="${#messages.msg('order.status.' + entry.newStatus().name())}"></strong>
                            <span th:if="${entry.oldStatus() != null and entry.oldStatus() != entry.newStatus()}"
                                  th:text="| ← ${#messages.msg('order.status.' + entry.oldStatus().name())}|"></span>
                            <p th:if="${entry.note() != null}" th:text="${entry.note()}"></p>
                            <small th:text="|${#temporals.format(entry.changedAt(), 'dd.MM.yyyy HH:mm')} ${entry.changedBy() ?: ''}|"></small>
                        </div>
                    </div>
                </section>
            </div>

            <aside>
                <div th:replace="~{fragments/order-delivery :: delivery(${order.delivery()})}"></div>
                <section class="admin-detail-card">
                    <h2 th:text="#{admin.order.customer}">Клиент</h2>
                    <p><strong th:text="|${order.customerFirstName()} ${order.customerLastName()}|"></strong></p>
                    <p><i class="bi bi-envelope me-2"></i><span th:text="${order.customerEmail() ?: '-'}"></span></p>
                    <p><i class="bi bi-telephone me-2"></i><span th:text="${order.customerPhone()}"></span></p>
                    <span class="badge text-bg-light"
                          th:text="${order.guestOrder() ? #messages.msg('admin.order.guest') : #messages.msg('admin.order.registered')}"></span>
                    <div class="admin-customer-note" th:if="${order.customerNote() != null}">
                        <strong th:text="#{checkout.note}">Допълнителна информация</strong>
                        <p th:text="${order.customerNote()}"></p>
                    </div>
                </section>

                <section class="admin-detail-card mt-4">
                    <h2 th:text="#{admin.order.manage}">Управление</h2>
                    <form th:action="@{/admin/orders/{id}/status(id=${order.id()})}" method="post">
                        <label class="form-label" for="status" th:text="#{admin.order.status}">Статус</label>
                        <select class="form-select mb-3" id="status" name="status">
                            <option th:each="status : ${statuses}" th:value="${status.name()}"
                                    th:selected="${status == order.orderStatus()}"
                                    th:text="${#messages.msg('order.status.' + status.name())}"></option>
                        </select>
                        <label class="form-label" for="note" th:text="#{admin.order.note}">Служебна бележка</label>
                        <textarea class="form-control mb-3" id="note" name="note" rows="4" maxlength="2000"></textarea>
                        <button class="btn btn-orange w-100" type="submit" th:text="#{admin.order.update}">Обнови
                            статуса
                        </button>
                    </form>
                </section>
            </aside>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js" th:src="@{/js/shop.js}"></script>
</body>
</html>
