<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title th:text="#{register.title}">Регистрация - AutoSilent</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>

<!-- Top Bar -->
<div th:replace="~{fragments/top-bar :: topBar}"></div>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Register Section -->
<main class="auth-page page-3d">
    <div class="container">
        <div class="row align-items-center justify-content-center g-5">

            <!-- Register form -->
            <div class="col-lg-6 col-md-9">
                <div class="auth-form-card register-card auth-3d-card tilt-card">
                    <div class="auth-form-header">
                        <h2 th:text="#{register.form.title}">Създай профил</h2>
                        <p th:text="#{register.form.intro}">Регистрирай се, за да поръчваш по-бързо и удобно.</p>
                    </div>

                    <form th:action="@{/user/sign_up}" th:object="${registration}" method="post" novalidate>
                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
                            <span th:text="#{form.correctErrors}">Моля, поправете отбелязаните полета.</span>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group-custom">
                                    <label for="firstName" th:text="#{form.firstName}">Име</label>
                                    <div class="input-icon-wrap">
                                        <i class="bi bi-person"></i>
                                        <input id="firstName"
                                               th:field="*{firstName}"
                                               type="text"
                                               class="form-control"
                                               th:errorclass="is-invalid"
                                               placeholder="Иван"
                                               autocomplete="given-name" maxlength="50">
                                    </div>
                                    <div class="invalid-feedback d-block" th:errors="*{firstName}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group-custom">
                                    <label for="lastName" th:text="#{form.lastName}">Фамилия</label>
                                    <div class="input-icon-wrap">
                                        <i class="bi bi-person"></i>
                                        <input id="lastName"
                                               th:field="*{lastName}"
                                               type="text"
                                               class="form-control"
                                               th:errorclass="is-invalid"
                                               placeholder="Иванов"
                                               autocomplete="family-name" maxlength="50">
                                    </div>
                                    <div class="invalid-feedback d-block" th:errors="*{lastName}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group-custom">
                            <label for="email" th:text="#{form.email}">Имейл адрес</label>
                            <div class="input-icon-wrap">
                                <i class="bi bi-envelope"></i>
                                <input id="email"
                                       th:field="*{email}"
                                       type="email"
                                       class="form-control"
                                       th:errorclass="is-invalid"
                                       placeholder="example@email.com"
                                       autocomplete="email" maxlength="254">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{email}"></div>
                        </div>

                        <div class="form-group-custom">
                            <label for="phoneNumber"><span th:text="#{form.phone}">Телефон</span> <span class="text-muted" th:text="#{form.optional}">(незадължително)</span></label>
                            <div class="input-icon-wrap">
                                <i class="bi bi-telephone"></i>
                                <input id="phoneNumber"
                                       th:field="*{phoneNumber}"
                                       type="tel"
                                       class="form-control"
                                       th:errorclass="is-invalid"
                                       placeholder="0888 123 456" autocomplete="tel" maxlength="20">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{phoneNumber}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group-custom">
                                    <label for="password" th:text="#{form.password}">Парола</label>
                                    <div class="input-icon-wrap">
                                        <i class="bi bi-lock"></i>
                                        <input id="password"
                                               th:field="*{password}"
                                               type="password"
                                               class="form-control"
                                               th:errorclass="is-invalid"
                                               th:placeholder="#{form.password.placeholder}"
                                               autocomplete="new-password" maxlength="72">
                                    </div>
                                    <div class="invalid-feedback d-block" th:errors="*{password}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group-custom">
                                    <label for="confirmPassword" th:text="#{form.password.repeat}">Повтори парола</label>
                                    <div class="input-icon-wrap">
                                        <i class="bi bi-lock-fill"></i>
                                        <input id="confirmPassword"
                                               th:field="*{confirmPassword}"
                                               type="password"
                                               class="form-control"
                                               th:errorclass="is-invalid"
                                               th:placeholder="#{form.password.repeat.placeholder}"
                                               autocomplete="new-password" maxlength="72">
                                    </div>
                                    <div class="invalid-feedback d-block" th:errors="*{confirmPassword}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="terms-check">
                            <label class="form-check-label terms-label" for="termsAccepted">
                                <input id="termsAccepted" th:field="*{termsAccepted}" class="form-check-input"
                                       th:errorclass="is-invalid" type="checkbox">
                                <span class="terms-label-text">
                                    <span th:text="#{register.terms.prefix}">Съгласен съм с</span>
                                    <a href="#" th:text="#{register.terms}">общите условия</a>
                                    <span th:text="#{register.privacy.prefix}">и</span>
                                    <a href="#" th:text="#{register.privacy}">политиката за поверителност</a>.
                                </span>
                            </label>
                            <div class="invalid-feedback d-block" th:errors="*{termsAccepted}"></div>
                        </div>

                        <button type="submit" class="btn-auth-primary" th:text="#{register.submit}">Създай профил</button>
                    </form>

                    <div class="auth-divider">
                        <span th:text="#{site.or}">или</span>
                    </div>

                    <a th:href="@{/user/sign_in}" class="btn-auth-secondary">
                        <span th:text="#{register.existing}">Вече имам профил</span>
                    </a>
                </div>
            </div>

            <!-- Right visual/text -->
            <div class="col-lg-5 d-none d-lg-block">
                <div class="auth-info-card register-info-card auth-3d-card tilt-card">
                    <span class="auth-label" th:text="#{register.label}">AutoSilent профил</span>
                    <h1 th:text="#{register.hero.title}">По-бързо пазаруване и повече удобство</h1>
                    <p th:text="#{register.hero.text}">Създай профил и управлявай поръчките си от едно място.</p>

                    <div class="auth-benefits">
                        <div>
                            <i class="bi bi-speedometer2"></i>
                            <span th:text="#{register.fastOrder}">Бърза поръчка</span>
                        </div>
                        <div>
                            <i class="bi bi-geo-alt"></i>
                            <span th:text="#{register.addresses}">Запазени адреси</span>
                        </div>
                        <div>
                            <i class="bi bi-stars"></i>
                            <span th:text="#{register.offers}">Специални оферти</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
