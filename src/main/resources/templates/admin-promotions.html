<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
    <title th:text="|#{promotion.heading} - AutoSilent|"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" th:href="@{/css/shop.css}" rel="stylesheet">
</head><body>
<div th:replace="~{fragments/top-bar :: topBar}"></div><div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <h1 class="h3" th:text="#{promotion.heading}"></h1>
    <p th:text="#{promotion.adminHelp}"></p>
    <p class="alert alert-success" th:if="${promotionSaved == true}" th:text="#{promotion.saved}"></p>
    <p class="alert alert-danger" th:if="${promotionInvalid == true}" th:text="#{promotion.invalid}"></p>
    <p class="alert alert-danger" th:if="${promotionError != null}" th:text="${promotionError}"></p>
    <section class="admin-detail-card my-4"><h2 th:text="#{promotion.add}"></h2>
        <form th:action="@{/admin/settings/promotions}" method="post"><div th:replace="~{fragments/promotion-form :: fields(${null})}"></div></form>
    </section>
    <section class="admin-detail-card my-4" th:each="offer : ${promotions}">
        <h2 class="h5" th:text="|#${offer.id} · ${offer.product.displayName}|"></h2>
        <form th:action="@{/admin/settings/promotions/{id}(id=${offer.id})}" method="post">
            <div th:replace="~{fragments/promotion-form :: fields(${offer})}"></div>
        </form>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js" th:src="@{/js/shop.js}"></script>
</body></html>
