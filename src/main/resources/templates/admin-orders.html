<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.orders.title}">Поръчки - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body th:data-currency="#{site.currency}">
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page">
    <section class="container py-5">
        <div class="section-title text-start">
            <span th:text="#{admin.orders.eyebrow}">Управление</span>
            <h1 th:text="#{admin.orders.heading}">Всички поръчки</h1>
        </div>

        <form class="shop-search-box mb-4" th:action="@{/admin/orders}" method="get" role="search">
            <i class="bi bi-search"></i>
            <label class="visually-hidden" for="orderSearch"
                   th:text="#{admin.orders.search.label}">Търсене по номер на поръчка</label>
            <input id="orderSearch" name="search" type="search" maxlength="50"
                   th:value="${search}" th:placeholder="#{admin.orders.search.placeholder}">
            <button type="submit" th:text="#{site.search}">Търси</button>
        </form>

        <div class="admin-table-card">
            <div class="table-responsive" th:if="${!orders.isEmpty()}">
                <table class="table align-middle admin-orders-table">
                    <thead><tr>
                        <th th:text="#{admin.order.number}">Номер</th>
                        <th th:text="#{admin.order.customer}">Клиент</th>
                        <th th:text="#{form.phone}">Телефон</th>
                        <th th:text="#{admin.order.type}">Тип</th>
                        <th th:text="#{admin.order.status}">Статус</th>
                        <th th:text="#{cart.total}">Общо</th>
                        <th th:text="#{admin.order.date}">Дата</th>
                        <th></th>
                    </tr></thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td><strong th:text="${order.orderNumber()}"></strong></td>
                        <td th:text="${order.customerName()}"></td>
                        <td th:text="${order.customerPhone()}"></td>
                        <td th:text="${order.guestOrder() ? #messages.msg('admin.order.guest') : #messages.msg('admin.order.registered')}"></td>
                        <td><span class="order-status" th:classappend="| status-${#strings.toLowerCase(order.status().name())}|"
                                  th:text="${#messages.msg('order.status.' + order.status().name())}"></span></td>
                        <td><strong th:text="#{product.price(${order.totalPrice()})}"></strong></td>
                        <td th:text="${#temporals.format(order.createdAt(), 'dd.MM.yyyy HH:mm')}"></td>
                        <td><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/orders/{id}(id=${order.id()})}"
                               th:text="#{admin.order.open}">Отвори</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="cart-empty" th:if="${orders.isEmpty()}">
                <i class="bi bi-receipt"></i>
                <h2 th:text="${search.isBlank()} ? #{admin.orders.empty} : #{admin.orders.search.empty(${search})}">
                    Няма намерени поръчки
                </h2>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
