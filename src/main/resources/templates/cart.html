<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Кошница за пазаруване в NiRTON.bg">
    <title>Кошница - NiRTON.bg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body th:data-currency="#{site.currency}">
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="cart-page">
    <section class="container py-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb custom-breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{site.home}">Начало</a></li>
                <li class="breadcrumb-item active" aria-current="page">Кошница</li>
            </ol>
        </nav>

        <div class="section-title text-start">
            <span>Твоята поръчка</span>
            <h1>Кошница</h1>
        </div>

        <div class="cart-layout">
            <section class="cart-items-card" aria-label="Продукти в кошницата">
                <div id="cartItems"></div>
                <div id="cartEmpty" class="cart-empty" hidden>
                    <i class="bi bi-cart-x"></i>
                    <h2>Кошницата е празна</h2>
                    <p>Добави продукт, за да продължиш с поръчката.</p>
                    <a class="btn btn-orange" th:href="@{/products}">Разгледай продуктите</a>
                </div>
            </section>

            <aside id="cartSummary" class="cart-summary-card">
                <h2>Общо</h2>
                <div><span>Продукти</span><strong id="cartSummaryCount">0</strong></div>
                <div class="cart-summary-total"><span>Крайна сума</span><strong id="cartSummaryTotal">0.00 лв.</strong></div>
                <button class="btn btn-orange w-100" type="button">Продължи към поръчка</button>
            </aside>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
