<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="#{cart.meta}">
    <title th:text="#{cart.pageTitle}">Кошница - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body th:data-currency="#{site.currency}" th:data-cart-quantity="#{cart.quantity}" th:data-cart-remove="#{cart.remove}"
      th:data-cart-increase="#{cart.increase}" th:data-cart-decrease="#{cart.decrease}"
      th:data-product-default-name="#{product.defaultName}" th:data-invalid-cart="#{cart.invalid}">
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="cart-page">
    <section class="container py-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb custom-breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{site.home}">Начало</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="#{cart.title}">Кошница</li>
            </ol>
        </nav>

        <div class="section-title text-start">
            <span th:text="#{cart.eyebrow}">Твоята поръчка</span>
            <h1 th:text="#{cart.title}">Кошница</h1>
        </div>

        <div class="cart-layout">
            <section class="cart-items-card" th:aria-label="#{cart.items}">
                <div id="cartItems"></div>
                <div id="cartEmpty" class="cart-empty" hidden>
                    <i class="bi bi-cart-x"></i>
                    <h2 th:text="#{cart.empty}">Кошницата е празна</h2>
                    <p th:text="#{cart.emptyText}">Добави продукт, за да продължиш с поръчката.</p>
                    <a class="btn btn-orange" th:href="@{/products}" th:text="#{cart.browse}">Разгледай продуктите</a>
                </div>
            </section>

            <aside id="cartSummary" class="cart-summary-card">
                <h2 th:text="#{cart.summary}">Общо</h2>
                <div>
                    <span
                            th:text="#{cart.products}">Продукти</span>
                    <strong id="cartSummaryCount">0</strong></div>
                <div class="cart-summary-total">
                    <span
                            th:text="#{cart.total}">Крайна сума</span>
                    <strong id="cartSummaryTotal">0.00 €</strong></div>
                <a sec:authorize="isAuthenticated()"
                   class="btn btn-orange w-100"
                   th:href="@{/orders/checkout}"
                   th:text="#{cart.checkout}">Продължи към поръчка</a>
                <p sec:authorize="!isAuthenticated()"
                   class="cart-auth-hint">
                    <a th:href="@{/user/sign_in}"
                       th:text="#{site.login}">Вход </a>
                    <span th:text="#{site.or}"
                    class="ms-1"> или </span>
                    <a th:href="@{/user/sign_up}"
                       th:text="#{site.register}"
                       class="ms-1"> Регистрация</a>
                </p>
                <a sec:authorize="!isAuthenticated()"
                   class="cart-guest-checkout mt-3"
                   th:href="@{/orders/checkout}"
                   th:text="#{cart.guestCheckout}">Поръчай като гост</a>
            </aside>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
