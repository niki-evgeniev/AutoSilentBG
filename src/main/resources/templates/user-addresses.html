<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title th:text="#{account.addresses}">Адреси за поръчки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="auth-page page-3d">
    <div class="container py-5">
        <div class="auth-form-card auth-3d-card tilt-card text-center mx-auto" style="max-width: 760px;">
            <i class="bi bi-geo-alt display-3"></i>
            <h1 class="h2 mt-3" th:text="#{account.addresses}">Адреси за поръчки</h1>
            <p th:text="#{account.addresses.empty}">Все още няма запазени адреси.</p>
            <a class="btn btn-outline-dark" th:href="@{/user/account}" th:text="#{account.back}">Назад</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
