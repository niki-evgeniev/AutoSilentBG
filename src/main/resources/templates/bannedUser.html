<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Временно недостъпен</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f5f7;
            color: #191919;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 560px;
            text-align: center;
        }

        .status {
            color: #ff6a00;
            font-size: 72px;
            font-weight: 900;
            line-height: 1;
        }

        h1 {
            margin: 20px 0 12px;
            font-size: clamp(30px, 6vw, 48px);
        }

        p {
            margin: 0;
            color: #606773;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<main>
    <div class="status">503</div>
    <h1>Сайтът временно не е достъпен</h1>
    <p>В момента извършваме техническа поддръжка. Моля, опитайте отново по-късно.</p>
</main>
</body>
</html>
