<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="#{account.orders}">Поръчки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page">
    <section class="container py-5">
        <div class="section-title text-start">
            <span th:text="#{account.orders.eyebrow}">Моят профил</span>
            <h1 th:text="#{account.orders.history}">История на поръчките</h1>
        </div>

        <div class="admin-table-card">
            <div class="table-responsive" th:if="${!orders.isEmpty()}">
                <table class="table align-middle admin-orders-table">
                    <thead>
                    <tr>
                        <th th:text="#{admin.order.number}">Номер</th>
                        <th th:text="#{admin.order.status}">Статус</th>
                        <th th:text="#{cart.total}">Общо</th>
                        <th th:text="#{admin.order.date}">Дата</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td><strong th:text="${order.orderNumber()}"></strong></td>
                        <td>
                            <span class="order-status"
                                  th:classappend="| status-${#strings.toLowerCase(order.status().name())}|"
                                  th:text="${#messages.msg('order.status.' + order.status().name())}"></span>
                        </td>
                        <td><strong th:text="#{product.price(${order.totalPrice()})}"></strong></td>
                        <td th:text="${#temporals.format(order.createdAt(), 'dd.MM.yyyy HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="cart-empty" th:if="${orders.isEmpty()}">
                <i class="bi bi-box-seam"></i>
                <h2 th:text="#{account.orders.empty}">Все още няма поръчки за показване.</h2>
            </div>
        </div>

        <a class="btn btn-outline-dark mt-4" th:href="@{/user/account}" th:text="#{account.back}">Назад</a>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
