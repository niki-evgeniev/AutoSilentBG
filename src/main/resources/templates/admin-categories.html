<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.categories.title}">Категории - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="admin-orders-page">
    <section class="container py-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb custom-breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{site.home}">Начало</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="#{admin.categories.heading}">Категории
                </li>
            </ol>
        </nav>

        <div class="section-title text-start">
            <span th:text="#{site.settings}">Настройки</span>
            <h1 th:text="#{admin.categories.heading}">Категории</h1>
        </div>

        <div th:if="${categoryCreated}" class="alert alert-success" th:text="#{admin.categories.created}">Категорията е
            добавена.
        </div>

        <div class="admin-order-grid">
            <section class="admin-detail-card">
                <h2 th:text="#{admin.categories.add}">Добави категория</h2>
                <form method="post" th:action="@{/admin/settings/categories}" th:object="${category}" novalidate>
                    <div class="form-group-custom mb-3">
                        <label for="categoryName" th:text="#{admin.categories.name}">Име</label>
                        <input id="categoryName" class="form-control" th:errorclass="is-invalid"
                               th:field="*{name}" maxlength="80" autocomplete="off"
                               th:placeholder="#{admin.categories.placeholder}">
                        <div class="invalid-feedback d-block" th:errors="*{name}"></div>
                    </div>
                    <button class="btn btn-orange w-100" type="submit" th:text="#{admin.categories.save}">Запази
                    </button>
                </form>
            </section>

            <section class="admin-detail-card">
                <h2 th:text="#{admin.categories.list}">Добавени категории</h2>
                <div class="table-responsive" th:if="${!categories.isEmpty()}">
                    <table class="table align-middle admin-orders-table">
                        <thead>
                        <tr>
                            <th th:text="#{admin.categories.name}">Име</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${categories}">
                            <td><strong th:text="${item.name()}">Категория</strong></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="cart-empty" th:if="${categories.isEmpty()}">
                    <i class="bi bi-grid"></i>
                    <h2 th:text="#{admin.categories.empty}">Няма добавени категории</h2>
                </div>
            </section>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
