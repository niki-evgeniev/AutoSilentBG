<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title th:text="#{login.title}">Вход в профила - Nirton</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>

<!-- Top Bar -->
<div th:replace="~{fragments/top-bar :: topBar}"></div>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Login Section -->
<main class="auth-page">
    <div class="container">
        <div class="row align-items-center justify-content-center g-5">

            <!-- Left visual/text -->
            <div class="col-lg-6 d-none d-lg-block">
                <div class="auth-info-card">
                    <span class="auth-label" th:text="#{login.welcome}">Добре дошъл обратно</span>
                    <h1 th:text="#{login.heading}">Влез в своя профил</h1>
                    <p th:text="#{login.intro}">Следи поръчките си и пазарувай по-бързо.</p>

                    <div class="auth-benefits">
                        <div>
                            <i class="bi bi-box-seam"></i>
                            <span th:text="#{login.orders}">История на поръчките</span>
                        </div>
                        <div>
                            <i class="bi bi-heart"></i>
                            <span th:text="#{login.favorites}">Любими продукти</span>
                        </div>
                        <div>
                            <i class="bi bi-shield-check"></i>
                            <span th:text="#{login.secure}">Сигурен профил</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Login form -->
            <div class="col-lg-5 col-md-8">
                <div class="auth-form-card">
                    <div class="auth-form-header">
                        <h2 th:text="#{login.form.title}">Вход</h2>
                        <p th:text="#{login.form.intro}">Въведи имейл и парола, за да продължиш.</p>
                    </div>

                    <div th:if="${registrationSuccess}" class="alert alert-success" role="alert"
                         th:text="#{register.success}"></div>
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        <span th:text="#{login.error}">Невалиден имейл или парола.</span>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        <span th:text="#{login.logout}">Излязохте успешно от профила си.</span>
                    </div>

                    <form th:action="@{/users/login}" method="post">
                        <div class="form-group-custom">
                            <label for="email" th:text="#{form.email}">Имейл адрес</label>
                            <div class="input-icon-wrap">
                                <i class="bi bi-envelope"></i>
                                <input id="email"
                                       value="info@carpmap.bg"
                                       name="email"
                                       type="email"
                                       class="form-control"
                                       placeholder="example@email.com"
                                       required>
                            </div>
                        </div>

                        <div class="form-group-custom">
                            <label for="password" th:text="#{form.password}">Парола</label>
                            <div class="input-icon-wrap">
                                <i class="bi bi-lock"></i>
                                <input id="password"
                                       value="12345"
                                       name="password"
                                       type="password"
                                       class="form-control"
                                       th:placeholder="#{login.password.placeholder}"
                                       required>
                            </div>
                        </div>

                        <div class="auth-options">
                            <div class="form-check">
                                <input id="rememberMe" class="form-check-input" type="checkbox" name="remember-me">
                                <label class="form-check-label" for="rememberMe">
                                    <span th:text="#{login.remember}">Запомни ме</span>
                                </label>
                            </div>

                            <a href="#" class="forgot-link" th:text="#{login.forgot}">Забравена парола?</a>
                        </div>

                        <button type="submit" class="btn-auth-primary" th:text="#{login.submit}">Влез в профила</button>
                    </form>

                    <div class="auth-divider">
                        <span th:text="#{site.or}">или</span>
                    </div>

                    <a th:href="@{/user/sign_up}" class="btn-auth-secondary">
                        <span th:text="#{login.create}">Създай нов профил</span>
                    </a>
                </div>
            </div>

        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
