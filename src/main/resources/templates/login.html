<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="bg">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Вход в профила - Nirton</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>

<!-- Top Bar -->
<div th:replace="~{fragments/top-bar :: topBar}"></div>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Login Section -->
<main class="auth-page">
    <div class="container">
        <div class="row align-items-center justify-content-center g-5">

            <!-- Left visual/text -->
            <div class="col-lg-6 d-none d-lg-block">
                <div class="auth-info-card">
                    <span class="auth-label">Добре дошъл обратно</span>
                    <h1>Влез в своя профил</h1>
                    <p>
                        Следи поръчките си, запазвай любими продукти и пазарувай по-бързо
                        с твоя Nirton профил.
                    </p>

                    <div class="auth-benefits">
                        <div>
                            <i class="bi bi-box-seam"></i>
                            <span>История на поръчките</span>
                        </div>
                        <div>
                            <i class="bi bi-heart"></i>
                            <span>Любими продукти</span>
                        </div>
                        <div>
                            <i class="bi bi-shield-check"></i>
                            <span>Сигурен профил</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Login form -->
            <div class="col-lg-5 col-md-8">
                <div class="auth-form-card">
                    <div class="auth-form-header">
                        <h2>Вход</h2>
                        <p>Въведи имейл и парола, за да продължиш.</p>
                    </div>

                    <form action="#" method="post">
                        <div class="form-group-custom">
                            <label for="email">Имейл адрес</label>
                            <div class="input-icon-wrap">
                                <i class="bi bi-envelope"></i>
                                <input id="email"
                                       name="email"
                                       type="email"
                                       class="form-control"
                                       placeholder="example@email.com"
                                       required>
                            </div>
                        </div>

                        <div class="form-group-custom">
                            <label for="password">Парола</label>
                            <div class="input-icon-wrap">
                                <i class="bi bi-lock"></i>
                                <input id="password"
                                       name="password"
                                       type="password"
                                       class="form-control"
                                       placeholder="Въведи парола"
                                       required>
                            </div>
                        </div>

                        <div class="auth-options">
                            <div class="form-check">
                                <input id="rememberMe" class="form-check-input" type="checkbox" name="remember-me">
                                <label class="form-check-label" for="rememberMe">
                                    Запомни ме
                                </label>
                            </div>

                            <a href="#" class="forgot-link">Забравена парола?</a>
                        </div>

                        <button type="submit" class="btn-auth-primary">
                            Влез в профила
                        </button>
                    </form>

                    <div class="auth-divider">
                        <span>или</span>
                    </div>

                    <a href="register.html" class="btn-auth-secondary">
                        Създай нов профил
                    </a>
                </div>
            </div>

        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
