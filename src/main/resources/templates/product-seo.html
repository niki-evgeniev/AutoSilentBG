<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="#{seo.pageTitle(${seo.productName})}">SEO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="product-form-page page-3d">
    <section class="product-form-hero page-3d-hero">
        <div class="container">
            <span class="eyebrow">SEO</span>
            <h1 th:text="#{seo.heading(${seo.productName})}">SEO настройки</h1>
            <p th:text="#{seo.intro}">Настройки за търсачки и споделяне.</p>
        </div>
    </section>
    <section class="product-form-section">
        <div class="container">
            <div th:if="${seoUpdated}" class="alert alert-success" th:text="#{seo.success}">Записано.</div>
            <form class="product-editor" method="post" th:action="@{/products/{id}/seo(id=${productId})}" th:object="${seo}" novalidate>
                <div class="product-editor-card tilt-card">
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" th:text="#{form.correctErrors}"></div>
                    <div class="form-group-custom">
                        <label for="title" th:text="#{seo.title}">SEO заглавие</label>
                        <input id="title" class="form-control" th:errorclass="is-invalid" th:field="*{title}" maxlength="70">
                        <div class="form-hint" th:text="#{seo.title.hint}"></div>
                        <div class="invalid-feedback d-block" th:errors="*{title}"></div>
                    </div>
                    <div class="form-group-custom">
                        <label for="description" th:text="#{seo.description}">Meta description</label>
                        <textarea id="description" class="form-control" th:errorclass="is-invalid" th:field="*{description}" maxlength="160" rows="4"></textarea>
                        <div class="form-hint" th:text="#{seo.description.hint}"></div>
                        <div class="invalid-feedback d-block" th:errors="*{description}"></div>
                    </div>
                    <div class="form-group-custom">
                        <label for="keywords" th:text="#{seo.keywords}">Ключови думи</label>
                        <input id="keywords" class="form-control" th:errorclass="is-invalid" th:field="*{keywords}" maxlength="500">
                        <div class="invalid-feedback d-block" th:errors="*{keywords}"></div>
                    </div>
                    <div class="form-group-custom">
                        <label for="imageUrl" th:text="#{seo.imageUrl}">URL на изображение</label>
                        <input id="imageUrl" type="url" class="form-control" th:errorclass="is-invalid" th:field="*{imageUrl}" maxlength="2048">
                        <div class="invalid-feedback d-block" th:errors="*{imageUrl}"></div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-orange" type="submit"><i class="bi bi-check-lg me-2"></i><span th:text="#{seo.save}">Запази</span></button>
                        <a class="btn btn-outline-dark custom-outline" th:href="@{/products/{id}(id=${productId})}" th:text="#{seo.back}">Назад</a>
                    </div>
                </div>
            </form>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
