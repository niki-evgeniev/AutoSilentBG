<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${product.displayName()} - AutoSilent|">Кит</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head><body>
<div th:replace="~{fragments/top-bar :: topBar}"></div><div th:replace="~{fragments/header :: header}"></div>
<main class="product-details-page page-3d"><section class="container py-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb custom-breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/}">Начало</a></li>
        <li class="breadcrumb-item"><a th:href="@{/shumoizolaciya/kit}">Китове</a></li>
        <li class="breadcrumb-item active" th:text="${product.displayName()}"></li>
    </ol></nav>
    <div class="row g-5 align-items-start">
        <div class="col-lg-7"><div class="product-gallery tilt-card"><div class="product-gallery-main product-3d-stage">
            <img th:if="${product.mainImageUrl() != null}" th:src="${product.mainImageUrl()}" th:alt="${product.displayName()}">
            <i th:unless="${product.mainImageUrl() != null}" class="bi bi-boxes product-details-placeholder"></i>
        </div></div></div>
        <div class="col-lg-5"><article class="product-details-card tilt-card"
             th:data-product-id="${product.id()}" th:data-product-name="${product.displayName()}"
             th:data-product-price="${product.price()}" th:data-product-image="${product.mainImageUrl()}"
             th:data-product-url="@{/shumoizolaciya/kit/{url}(url=${product.url()})}">
            <span class="eyebrow">Кит</span><h1 th:text="${product.displayName()}"></h1>
            <div class="product-details-price" th:text="|Цена: ${product.price()} €|"></div>
            <div class="product-stock-info" th:text="${product.stock() > 0 ? 'В наличност' : 'Изчерпан'}"></div>
            <div class="product-purchase-actions"><label class="quantity-control">Количество
                <input id="productQuantity" type="number" value="1" min="1" th:max="${product.stock()}"></label>
                <button class="btn btn-orange product-add-cart" th:disabled="${product.stock() == 0}">
                    <i class="bi bi-cart-plus"></i> Добави в количката</button></div>
        </article></div>
    </div>
    <div class="product-information-card tilt-card mt-5">
        <h2>Описание</h2><div class="product-description-content" th:utext="${product.description()}"></div>
    </div>
</section></main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/shop.js"></script>
</body></html>
