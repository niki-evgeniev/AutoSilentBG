<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <link rel="canonical" th:href="${seoPage.canonicalUrl()}">
    <title th:text="|${product.displayName()} - AutoSilent|">AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head><body>
<div th:replace="~{fragments/top-bar :: topBar}"></div><div th:replace="~{fragments/header :: header}"></div>
<main class="product-details-page page-3d"><section class="container py-5">
    <nav th:aria-label="#{kit.breadcrumb}"><ol class="breadcrumb custom-breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{site.home}">Начало</a></li>
        <li class="breadcrumb-item"><a th:href="@{/shumoizolaciya/kit}" th:text="#{site.kits}">Китове</a></li>
        <li class="breadcrumb-item active" aria-current="page" th:text="${product.displayName()}"></li>
    </ol></nav>
    <div class="row g-5 align-items-start">
        <div class="col-lg-7"><div class="product-gallery tilt-card"><div class="product-gallery-main product-3d-stage">
            <img th:if="${product.mainImageUrl() != null}" th:src="${product.mainImageUrl()}" th:alt="${product.displayName()}">
            <i th:unless="${product.mainImageUrl() != null}" class="bi bi-boxes product-details-placeholder"></i>
        </div></div></div>
        <div class="col-lg-5"><article class="product-details-card tilt-card"
             th:data-product-id="${product.id()}" th:data-product-name="${product.displayName()}"
             th:data-product-price="${product.price()}" th:data-product-image="${product.mainImageUrl()}"
             th:data-product-url="@{/shumoizolaciya/kit/{url}(url=${product.url()})}">
            <span class="eyebrow" th:text="#{kit.badge}">Кит</span><h1 th:text="${product.displayName()}"></h1>
            <div class="product-meta" th:if="${!kitCategories.isEmpty()}">
                <span th:each="category : ${kitCategories}" th:text="${category}">Категория</span>
            </div>
            <div class="product-details-price" th:text="#{product.priceWithLabel(${#numbers.formatDecimal(product.price(), 1, 2, 'POINT')})}">Цена: 0.00 €</div>
            <div class="product-stock-info" th:text="${product.stock() > 0} ? #{details.inStock} : #{details.soldOut}">В наличност</div>
            <div class="product-purchase-actions"><label class="quantity-control"><span th:text="#{details.quantity}">Количество</span>
                <input id="productQuantity" type="number" value="1" min="1" th:max="${product.stock()}"></label>
                <button class="btn btn-orange product-add-cart" th:disabled="${product.stock() == 0}">
                    <i class="bi bi-cart-plus"></i><span th:text="${product.stock() > 0} ? #{product.addCart} : #{products.soldOut}">Добави в количката</span></button></div>
        </article></div>
    </div>
    <div class="product-information-card tilt-card mt-5">
        <h2 th:text="#{kit.details.description}">Описание</h2><div class="product-description-content" th:utext="${product.description()}"></div>
    </div>
    <div class="product-information-card tilt-card mt-4" th:if="${!kitItems.empty}">
        <h2 th:text="#{kit.details.components}">Продукти в кита</h2>
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center gap-3" th:each="item : ${kitItems}">
                <a class="d-flex align-items-center gap-3 text-decoration-none" th:href="@{/shumoizolaciya/{id}(id=${item.product.id})}">
                    <span class="kit-product-thumb">
                        <img th:if="${kitItemImages[item.product.id] != null}" th:src="${kitItemImages[item.product.id]}"
                             th:alt="${item.product.displayName}" loading="lazy">
                        <i th:unless="${kitItemImages[item.product.id] != null}" class="bi bi-image" aria-hidden="true"></i>
                    </span>
                    <span th:text="${item.product.displayName}">Продукт</span>
                </a>
                <span th:text="#{kit.units(${item.quantity})}">1 бр.</span>
            </li>
        </ul>
    </div>
</section></main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/shop.js"></script>
</body></html>
