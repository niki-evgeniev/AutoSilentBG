<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
    <title th:text="#{admin.users.title}">Профили - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/shop.css" rel="stylesheet">
</head>
<body><div th:replace="~{fragments/top-bar :: topBar}"></div><div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page"><section class="container py-5">
    <div class="section-title text-start"><span th:text="#{admin.users.eyebrow}">Управление</span><h1 th:text="#{admin.users.heading}">Регистрирани профили</h1></div>
    <div class="admin-table-card">
        <div class="table-responsive" th:if="${!users.isEmpty()}"><table class="table align-middle admin-orders-table">
            <thead><tr><th th:text="#{admin.users.role}">Роля</th><th th:text="#{admin.users.profile}">Профил</th><th th:text="#{form.phone}">Телефон</th><th th:text="#{admin.users.discount}">Отстъпка</th><th th:text="#{admin.users.status}">Статус</th><th></th></tr></thead>
            <tbody><tr th:each="account : ${users}">
                <td><span class="badge text-bg-dark" th:text="${account.role().name() == 'ADMIN'} ? #{role.ADMIN} : (${account.role().name() == 'MODERATOR'} ? #{role.MODERATOR} : #{role.USER})">USER</span></td>
                <td><strong th:text="|${account.firstName()} ${account.lastName()}|">Име</strong><small class="d-block text-muted" th:text="${account.email()}">email</small></td>
                <td th:text="${account.phoneNumber() ?: '—'}">—</td>
                <td th:text="|${account.discountPercent()}%|">0%</td>
                <td><span class="badge" th:classappend="${account.blocked()} ? ' text-bg-danger' : ' text-bg-success'" th:text="${account.blocked()} ? #{admin.users.blocked} : #{admin.users.active}">Активен</span></td>
                <td><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/users/{id}(id=${account.id()})}"><i class="bi bi-person-gear me-1"></i><span th:text="#{admin.users.details}">Детайли</span></a></td>
            </tr></tbody>
        </table></div>
        <div class="cart-empty" th:if="${users.isEmpty()}"><i class="bi bi-people"></i><h2 th:text="#{admin.users.empty}">Няма профили</h2></div>
    </div>
</section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
