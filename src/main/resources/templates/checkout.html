<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="#{checkout.meta}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="#{checkout.title}">Завършване на поръчката - NiRTON.bg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body th:data-currency="#{site.currency}" th:data-cart-quantity="#{cart.quantity}"
      th:data-cart-remove="#{cart.remove}" th:data-invalid-cart="#{cart.invalid}"
      th:data-first-name-required="#{checkout.firstNameRequired}"
      th:data-last-name-required="#{checkout.lastNameRequired}"
      th:data-phone-required="#{checkout.phoneRequired}"
      th:data-phone-invalid="#{checkout.phoneInvalid}">
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="cart-page">
    <section class="container py-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb custom-breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/cart}" th:text="#{cart.title}">Кошница</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="#{checkout.heading}">Завършване</li>
            </ol>
        </nav>
        <div class="section-title text-start">
            <span th:text="#{checkout.eyebrow}">Последна стъпка</span>
            <h1 th:text="#{checkout.heading}">Завършване на поръчката</h1>
        </div>

        <div class="cart-layout">
            <section class="cart-items-card">
                <h2 class="h4 mb-4" th:text="#{checkout.products}">Продукти</h2>
                <div id="cartItems"></div>
                <div id="cartEmpty" class="cart-empty" hidden>
                    <h2 th:text="#{cart.empty}">Кошницата е празна</h2>
                    <a class="btn btn-orange" th:href="@{/products}" th:text="#{cart.browse}">Разгледай продуктите</a>
                </div>
            </section>

            <aside id="cartSummary" class="cart-summary-card checkout-card">
                <h2 th:text="#{checkout.details}">Данни за поръчката</h2>
                <div class="checkout-customer">
                    <small th:text="${customer.email()}"></small>
                </div>
                <div class="row g-2">
                    <div class="col-sm-6">
                        <label class="form-label" for="checkoutFirstName" th:text="#{form.firstName}">Име</label>
                        <input class="form-control mb-3 checkout-required" id="checkoutFirstName" type="text"
                               autocomplete="given-name" maxlength="100" th:value="${customer.firstName()}" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label" for="checkoutLastName" th:text="#{form.lastName}">Фамилия</label>
                        <input class="form-control mb-3 checkout-required" id="checkoutLastName" type="text"
                               autocomplete="family-name" maxlength="100" th:value="${customer.lastName()}" required>
                    </div>
                </div>
                <label class="form-label" for="checkoutPhone" th:text="#{form.phone}">Телефон</label>
                <input class="form-control mb-3 checkout-required" id="checkoutPhone" type="tel" autocomplete="tel"
                       pattern="(?=(?:.*\d){7,})[+]?[0-9 ()-]{7,20}" th:value="${customer.phone()}" required>
                <label class="form-label" for="customerNote" th:text="#{checkout.note}">Допълнителна информация</label>
                <textarea class="form-control mb-3" id="customerNote" rows="4" maxlength="2000"
                          th:placeholder="#{checkout.notePlaceholder}"></textarea>
                <div class="checkout-payment-note"><i class="bi bi-cash-coin"></i><span th:text="#{checkout.cashOnly}">Плащане с наложен платеж</span></div>
                <div><span th:text="#{cart.products}">Продукти</span><strong id="cartSummaryCount">0</strong></div>
                <div class="cart-summary-total"><span th:text="#{cart.total}">Крайна сума</span><strong id="cartSummaryTotal">0.00 €</strong></div>
                <div id="checkoutError" class="alert alert-danger" hidden></div>
                <button id="cartCheckoutButton" class="btn btn-orange w-100" type="button"
                        th:text="#{checkout.confirm}">Потвърди поръчката</button>
            </aside>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
