<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${product.description()}">
    <title th:text="#{details.title(${product.name()})}">Детайли за продукт - Nirton.bg</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body th:data-cart-added="#{product.added}" th:data-currency="#{site.currency}">

<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="product-details-page page-3d">
    <section class="product-details-hero page-3d-hero">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb custom-breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{site.home}">Начало</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/products}" th:text="#{site.products}">Продукти</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${product.name()}">Продукт</li>
                </ol>
            </nav>

            <div class="row g-5 align-items-start">
                <div class="col-lg-7">
                    <div class="product-gallery tilt-card">
                        <div class="product-gallery-main product-3d-stage">
                            <img id="productMainImage"
                                 th:if="${product.mainImageUrl() != null}"
                                 th:src="${product.mainImageUrl()}"
                                 th:alt="${product.name()}">
                            <i th:unless="${product.mainImageUrl() != null}"
                               class="bi bi-box-seam product-details-placeholder"></i>
                        </div>

                        <div class="product-thumbnails" th:if="${product.imageUrls().size() > 1}">
                            <button type="button"
                                    class="product-thumbnail tilt-card"
                                    th:each="imageUrl, imageStatus : ${product.imageUrls()}"
                                    th:classappend="${imageStatus.first ? ' active' : ''}"
                                    th:data-image-url="${imageUrl}"
                                    th:aria-label="#{details.image(${imageStatus.count}, ${product.name()})}">
                                <img th:src="${imageUrl}" th:alt="|${product.name()} - снимка ${imageStatus.count}|">
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <article class="product-details-card tilt-card"
                             th:data-product-id="${product.id()}"
                             th:data-product-name="${product.name()}"
                             th:data-product-price="${product.price()}"
                             th:data-product-image="${product.mainImageUrl()}"
                             th:data-product-url="@{/products/{id}(id=${product.id()})}">
                        <span class="eyebrow" th:text="${product.category()}">Категория</span>
                        <h1 th:text="${product.name()}">Име на продукта</h1>

                        <div class="product-details-meta">
                            <span><i class="bi bi-upc-scan"></i> <span th:text="#{details.code}">Код:</span> <strong th:text="${product.sku()}">SKU</strong></span>
                            <span th:classappend="${product.stock() > 0 ? ' in-stock' : ' out-of-stock'}">
                                <i th:class="${product.stock() > 0 ? 'bi bi-check-circle-fill' : 'bi bi-x-circle-fill'}"></i>
                                <strong th:text="${product.stock() > 0 ? #messages.msg('details.inStock') : #messages.msg('details.soldOut')}">В наличност</strong>
                            </span>
                        </div>

                        <div class="product-details-price"
                             th:text="#{product.price(${product.price()})}">0.00 €</div>

                        <form class="quick-order-form"
                              th:if="${product.stock() > 0}"
                              th:action="@{/orders/quick}"
                              method="post">
                            <input type="hidden" name="productId" th:value="${product.id()}">
                            <input id="quickOrderQuantity" type="hidden" name="quantity" value="1">
                            <h2 class="h5 text-center" th:text="#{quickOrder.title}">Бърза поръчка</h2>

                            <div class="alert alert-danger" th:if="${orderError}" th:text="${orderError}"></div>

                            <div class="mb-3 text-center">
                                <label class="form-label "
                                       for="quickOrderNames" th:text="#{quickOrder.names}">Две имена</label>
                                <input class="form-control"
                                       id="quickOrderNames"
                                       name="names"
                                       type="text"
                                       autocomplete="name"
                                       required>
                            </div>

                            <div class="mb-3 text-center">
                                <label class="form-label"
                                       for="quickOrderEmail" th:text="#{quickOrder.email}">Имейл</label>
                                <input class="form-control"
                                       id="quickOrderEmail"
                                       name="email"
                                       type="email"
                                       autocomplete="email"
                                       required>
                            </div>

                            <div class="mb-3 text-center">
                                <label class="form-label"
                                       for="quickOrderPhone" th:text="#{quickOrder.phone}">Телефон</label>
                                <input class="form-control"
                                       id="quickOrderPhone"
                                       name="phone"
                                       type="tel"
                                       autocomplete="tel"
                                       required>
                            </div>

                            <button class="btn btn-orange w-100" type="submit" th:text="#{quickOrder.submit}">Поръчай бързо</button>
                        </form>

                        <div class="product-stock-info" th:if="${product.stock() > 0}">
                            <i class="bi bi-box2-heart"></i>
                            <span th:text="#{details.available(${product.stock()})}">Налични 0 броя</span>
                        </div>

                        <div class="product-purchase-actions">
                            <label class="quantity-control" th:if="${product.stock() > 0}">
                                <span th:text="#{details.quantity}">Количество</span>
                                <input id="productQuantity" type="number" value="1" min="1" th:max="${product.stock()}">
                            </label>
                            <button class="btn btn-orange product-add-cart"
                                    th:disabled="${product.stock() == 0}">
                                <i class="bi bi-cart-plus"></i>
                                <span th:text="${product.stock() > 0 ? #messages.msg('product.addCart') : #messages.msg('details.soldOutLong')}">
                                    Добави в количката
                                </span>
                            </button>
                        </div>

                        <div class="product-details-assurances">
                            <div><i class="bi bi-truck"></i><span><strong th:text="#{details.fastDelivery}">Бърза доставка</strong><span th:text="#{details.deliveryTime}">1–2 работни дни</span></span></div>
                            <div><i class="bi bi-shield-check"></i><span><strong th:text="#{details.secureOrder}">Сигурна поръчка</strong><span th:text="#{details.protectedData}">Защитени данни</span></span></div>
                            <div><i class="bi bi-arrow-counterclockwise"></i><span><strong th:text="#{details.easyReturns}">Лесно връщане</strong><span th:text="#{details.returnTime}">До 14 дни</span></span></div>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </section>

    <section class="product-information-section">
        <div class="container">
            <div class="product-information-card tilt-card">
                <div class="section-title text-start">
                    <span th:text="#{details.moreInfo}">Повече информация</span>
                    <h2 th:text="#{details.description}">Описание на продукта</h2>
                </div>
                <p th:text="${product.description()}">Описание на продукта</p>
                <a class="btn btn-outline-dark custom-outline" th:href="@{/products}">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{details.back}">Обратно към продуктите</span>
                </a>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
<script>
    document.querySelectorAll('.product-thumbnail').forEach((thumbnail) => {
        thumbnail.addEventListener('click', () => {
            const mainImage = document.getElementById('productMainImage');
            if (!mainImage) return;

            mainImage.src = thumbnail.dataset.imageUrl;
            document.querySelectorAll('.product-thumbnail').forEach((item) => item.classList.remove('active'));
            thumbnail.classList.add('active');
        });
    });
</script>
</body>
</html>
