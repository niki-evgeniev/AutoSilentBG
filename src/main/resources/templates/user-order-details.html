<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title th:text="#{account.order.title(${order.orderNumber()})}">Поръчка - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body th:data-currency="#{site.currency}">
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page">
    <section class="container py-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb custom-breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/user/orders}" th:text="#{account.orders}">Поръчки</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page"
                    th:text="${order.orderNumber()}">Номер</li>
            </ol>
        </nav>

        <div class="admin-order-heading">
            <div>
                <span th:text="#{admin.order.number}">Номер</span>
                <h1 th:text="${order.orderNumber()}">NRT-1</h1>
            </div>
            <span class="order-status"
                  th:classappend="| status-${#strings.toLowerCase(order.orderStatus().name())}|"
                  th:text="${#messages.msg('order.status.' + order.orderStatus().name())}">Статус</span>
        </div>

        <div>
            <section class="admin-detail-card">
                <h2 th:text="#{checkout.products}">Продукти в поръчката</h2>
                <p class="text-muted mb-4">
                    <i class="bi bi-calendar3 me-2"></i>
                    <span th:text="${#temporals.format(order.createdAt(), 'dd.MM.yyyy HH:mm')}">
                        18.07.2026 15:35
                    </span>
                </p>
                <article class="admin-order-item" th:each="item : ${order.items()}">
                    <div class="admin-order-item-image">
                        <img th:if="${item.productImageUrl() != null}"
                             th:src="${item.productImageUrl()}" th:alt="${item.productName()}">
                        <i th:unless="${item.productImageUrl() != null}" class="bi bi-box-seam"></i>
                    </div>
                    <div>
                        <strong th:text="${item.productName()}">Продукт</strong>
                        <small th:if="${item.productSku() != null}" th:text="${item.productSku()}">SKU</small>
                    </div>
                    <span th:text="|${item.quantity()} × ${#messages.msg('product.price', item.unitPrice())}|"></span>
                    <strong th:text="#{product.price(${item.totalPrice()})}"></strong>
                </article>

                <div class="admin-order-totals">
                    <div>
                        <span th:text="#{admin.order.subtotal}">Междинна сума</span>
                        <strong th:text="#{product.price(${order.subtotalPrice()})}"></strong>
                    </div>
                    <div>
                        <span th:text="#{admin.order.delivery}">Доставка</span>
                        <strong th:text="#{product.price(${order.deliveryPrice()})}"></strong>
                    </div>
                    <div class="text-success"
                         th:if="${order.discountPrice() != null and order.discountPrice().signum() > 0}">
                        <span th:text="#{admin.order.discount}">Отстъпка</span>
                        <strong th:text="|−${#messages.msg('product.price', order.discountPrice())}|"></strong>
                    </div>
                    <div th:if="${order.promoCode() != null}">
                        <span th:text="#{checkout.promoCode}">Промокод</span>
                        <strong th:text="|${order.promoCode()} (${order.promoDiscountPercent()}%)|">CODE</strong>
                    </div>
                    <div class="total">
                        <span th:text="#{cart.total}">Общо</span>
                        <strong th:text="#{product.price(${order.totalPrice()})}"></strong>
                    </div>
                </div>
            </section>
        </div>

        <a class="btn btn-outline-dark mt-4" th:href="@{/user/orders}"
           th:text="#{account.order.back}">Назад към поръчките</a>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
