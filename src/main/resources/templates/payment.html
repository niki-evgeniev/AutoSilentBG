<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="#{payment.meta}">
    <link rel="canonical" href="https://autosilent.bg/payment">
    <title th:text="#{payment.pageTitle}">Плащане - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="product-form-page page-3d">
    <section class="product-form-hero page-3d-hero">
        <div class="container">
            <nav aria-label="breadcrumb"><ol class="breadcrumb custom-breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{site.home}">Начало</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="#{footer.payment}">Плащане</li>
            </ol></nav>
            <span class="eyebrow" th:text="#{payment.eyebrow}">Информация</span>
            <h1 th:text="#{footer.payment}">Плащане</h1>
        </div>
    </section>
    <section class="product-form-section">
        <div class="container">
            <article class="product-editor-card tilt-card mx-auto" style="max-width: 900px;">
                <div class="editor-card-heading">
                    <div class="editor-card-icon"><i class="bi bi-cash-coin"></i></div>
                    <div><h2 th:text="#{payment.heading}">Начин на плащане</h2></div>
                </div>
                <p class="fs-5 mb-0" th:text="#{payment.text}">Информация за плащането.</p>
            </article>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
