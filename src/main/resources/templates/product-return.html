<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="#{return.meta}">
    <link rel="canonical" href="https://autosilent.bg/returns">
    <title th:text="#{return.pageTitle}">Връщане на стока - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="product-form-page page-3d">
    <section class="product-form-hero page-3d-hero">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb custom-breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{site.home}">Начало</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="#{return.heading}">Връщане на
                        стока
                    </li>
                </ol>
            </nav>
            <span class="eyebrow" th:text="#{return.eyebrow}">Заявка за връщане</span>
            <h1 th:text="#{return.heading}">Връщане на стока</h1>
            <p th:text="#{return.intro}">Попълнете формата и ще се свържем с вас.</p>
        </div>
    </section>

    <section class="product-form-section">
        <div class="container">
            <form class="product-editor" method="post" th:action="@{/returns}"
                  th:object="${returnRequest}" novalidate>
                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" th:text="#{form.correctErrors}"></div>

                <div class="product-editor-card tilt-card mb-4">
                    <div class="editor-card-heading">
                        <div class="editor-card-icon"><i class="bi bi-receipt"></i></div>
                        <div>
                            <h2 th:text="#{return.order.heading}">Информация за поръчка</h2>
                            <p th:text="#{return.order.help}">Въведете данните така, както са посочени в поръчката.</p>
                        </div>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-6 form-group-custom">
                            <label for="returnFirstName" th:text="#{return.firstName}">Име</label>
                            <div class="input-icon-wrap"><i class="bi bi-person"></i>
                                <input id="returnFirstName" class="form-control" th:errorclass="is-invalid"
                                       th:field="*{firstName}" th:placeholder="#{return.firstName.placeholder}"
                                       maxlength="100" autocomplete="given-name">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label for="returnLastName" th:text="#{return.lastName}">Фамилия</label>
                            <div class="input-icon-wrap"><i class="bi bi-person"></i>
                                <input id="returnLastName" class="form-control" th:errorclass="is-invalid"
                                       th:field="*{lastName}" th:placeholder="#{return.lastName.placeholder}"
                                       maxlength="100" autocomplete="family-name">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{lastName}"></div>
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label for="returnEmail" th:text="#{return.email}">Имейл</label>
                            <div class="input-icon-wrap"><i class="bi bi-envelope"></i>
                                <input id="returnEmail" type="email" class="form-control" th:errorclass="is-invalid"
                                       th:field="*{email}" th:placeholder="#{return.email.placeholder}"
                                       maxlength="254" autocomplete="email">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label for="returnPhone" th:text="#{return.phone}">Телефон</label>
                            <div class="input-icon-wrap"><i class="bi bi-telephone"></i>
                                <input id="returnPhone" type="tel" class="form-control" th:errorclass="is-invalid"
                                       th:field="*{phone}" th:placeholder="#{return.phone.placeholder}"
                                       maxlength="30" autocomplete="tel">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label for="returnOrderNumber" th:text="#{return.orderNumber}">Номер на поръчка</label>
                            <div class="input-icon-wrap"><i class="bi bi-hash"></i>
                                <input id="returnOrderNumber" class="form-control" th:errorclass="is-invalid"
                                       th:field="*{orderNumber}" th:placeholder="#{return.orderNumber.placeholder}"
                                       maxlength="50" autocomplete="off">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{orderNumber}"></div>
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label for="returnOrderedOn" th:text="#{return.orderedOn}">Поръчано на</label>
                            <div class="input-icon-wrap"><i class="bi bi-calendar3"></i>
                                <input id="returnOrderedOn" type="date" class="form-control" th:errorclass="is-invalid"
                                       th:field="*{orderedOn}" th:max="${today}">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{orderedOn}"></div>
                        </div>
                    </div>
                </div>

                <div class="product-editor-card tilt-card">
                    <div class="editor-card-heading">
                        <div class="editor-card-icon"><i class="bi bi-box-seam"></i></div>
                        <div>
                            <h2 th:text="#{return.product.heading}">Информация за продукт и причина за връщане</h2>
                            <p th:text="#{return.product.help}">Името и кодът се попълват ръчно.</p>
                        </div>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-8 form-group-custom">
                            <label for="returnProductName" th:text="#{return.productName}">Име/модел на продукт</label>
                            <div class="input-icon-wrap"><i class="bi bi-box"></i>
                                <input id="returnProductName" class="form-control" th:errorclass="is-invalid"
                                       th:field="*{productName}" th:placeholder="#{return.productName.placeholder}"
                                       maxlength="200" autocomplete="off">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{productName}"></div>
                        </div>
                        <div class="col-md-4 form-group-custom">
                            <label for="returnProductCode" th:text="#{return.productCode}">Продуктов код</label>
                            <div class="input-icon-wrap"><i class="bi bi-upc-scan"></i>
                                <input id="returnProductCode" class="form-control" th:errorclass="is-invalid"
                                       th:field="*{productCode}" th:placeholder="#{return.productCode.placeholder}"
                                       maxlength="100" autocomplete="off">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{productCode}"></div>
                        </div>
                        <div class="col-md-4 form-group-custom">
                            <label for="returnQuantity" th:text="#{return.quantity}">Количество</label>
                            <div class="input-icon-wrap"><i class="bi bi-123"></i>
                                <input id="returnQuantity" type="number" min="1" max="9999" step="1"
                                       class="form-control" th:errorclass="is-invalid" th:field="*{quantity}"
                                       th:placeholder="#{return.quantity.placeholder}">
                            </div>
                            <div class="invalid-feedback d-block" th:errors="*{quantity}"></div>
                        </div>
                        <div class="col-md-8 form-group-custom">
                            <label for="returnResolution" th:text="#{return.resolution}">Желано решение</label>
                            <select id="returnResolution" class="form-select" th:errorclass="is-invalid"
                                    th:field="*{resolution}">
                                <option value="" th:text="#{return.resolution.choose}">Изберете</option>
                                <option value="REFUND" th:text="#{return.resolution.refund}">Възстановяване на сумата
                                </option>
                                <option value="EXCHANGE" th:text="#{return.resolution.exchange}">Замяна</option>
                            </select>
                            <div class="invalid-feedback d-block" th:errors="*{resolution}"></div>
                        </div>
                        <div class="col-12 form-group-custom">
                            <label for="returnReason" th:text="#{return.reason}">Причина за връщане</label>
                            <textarea id="returnReason" class="form-control product-description"
                                      th:errorclass="is-invalid"
                                      th:field="*{reason}" th:placeholder="#{return.reason.placeholder}"
                                      maxlength="2000" rows="6"></textarea>
                            <div class="form-text" th:text="#{return.reason.help}">Опишете състоянието и проблема.</div>
                            <div class="invalid-feedback d-block" th:errors="*{reason}"></div>
                        </div>
                    </div>
                    <div class="alert alert-light border mt-4 mb-0" th:text="#{return.notice}"></div>
                    <button class="btn btn-orange mt-4" type="submit">
                        <i class="bi bi-send me-2"></i><span th:text="#{return.submit}">Изпрати заявката</span>
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
