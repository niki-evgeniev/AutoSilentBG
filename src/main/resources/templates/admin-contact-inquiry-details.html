<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="#{admin.inquiries.details.title}">Запитване - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page">
    <section class="container py-5">
        <a class="btn btn-outline-dark mb-4" th:href="@{/admin/inquiries}"><i class="bi bi-arrow-left me-2"></i><span th:text="#{admin.inquiries.back}">Назад</span></a>
        <article class="product-editor-card tilt-card">
            <div class="d-flex flex-wrap justify-content-between gap-3 mb-4">
                <div><span class="eyebrow" th:text="#{admin.inquiries.details.eyebrow}">Запитване</span><h1 th:text="${inquiry.subject()}">Тема</h1></div>
                <time class="text-muted" th:text="${#temporals.format(inquiry.createdAt(), 'dd.MM.yyyy HH:mm:ss')}">Дата</time>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-4"><strong th:text="#{contact.name}">Име</strong><p th:text="${inquiry.name()}"></p></div>
                <div class="col-md-4"><strong th:text="#{contact.email}">Email</strong><p><a th:href="|mailto:${inquiry.email()}|" th:text="${inquiry.email()}"></a></p></div>
                <div class="col-md-4"><strong>IP</strong><p th:text="${inquiry.ipAddress()}"></p></div>
            </div>
            <hr>
            <h2 class="h5" th:text="#{contact.message}">Съобщение</h2>
            <p class="fs-5" style="white-space: pre-wrap;" th:text="${inquiry.message()}">Съобщение</p>
            <a class="btn btn-orange mt-3" th:href="|mailto:${inquiry.email()}?subject=Re: ${inquiry.subject()}|">
                <i class="bi bi-reply me-2"></i><span th:text="#{admin.inquiries.reply}">Отговори по email</span>
            </a>
        </article>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
