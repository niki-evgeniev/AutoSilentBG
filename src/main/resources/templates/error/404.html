<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title th:text="#{error.404.title}">Страницата не е намерена - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<main class="error-page">
    <section class="error-card">
        <div class="error-code">404</div>
        <i class="bi bi-search error-icon"></i>
        <h1 th:text="#{error.404.heading}">Страницата не е намерена</h1>
        <p th:text="#{error.404.text}">
            Връзката може да е променена или съдържанието вече да не е достъпно.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-3">
            <a class="btn btn-orange" th:href="@{/}" th:text="#{error.404.home}">Към началната страница</a>
            <a class="btn btn-outline-dark custom-outline" th:href="@{/shumoizolaciya}"
               th:text="#{error.404.products}">Разгледай продуктите</a>
        </div>
    </section>
</main>
</body>
</html>
