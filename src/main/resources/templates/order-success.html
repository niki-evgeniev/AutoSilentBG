<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{order.success.title}">Успешна поръчка - NiRTON.bg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body th:data-currency="#{site.currency}">
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="cart-page">
    <section class="container py-5 text-center">
        <div class="cart-items-card mx-auto" style="max-width: 680px">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 70px"></i>
            <h1 class="mt-3" th:text="#{order.success.heading}">Поръчката е приета</h1>
            <p th:text="#{order.success.text}">Ще се свържем с вас за потвърждение.</p>
            <p><span th:text="#{order.success.number}">Номер:</span> <strong th:text="${orderNumber}"></strong></p>
            <a class="btn btn-orange mt-3" th:href="@{/products}" th:text="#{cart.browse}">Разгледай продуктите</a>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/js/shop.js"></script>
</body>
</html>
