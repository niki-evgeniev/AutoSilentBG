<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
    <title th:text="#{admin.users.details.title}">Редакция на профил - AutoSilent</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/shop.css" rel="stylesheet">
</head><body><div th:replace="~{fragments/top-bar :: topBar}"></div><div th:replace="~{fragments/header :: header}"></div>
<main class="product-form-page page-3d"><section class="product-form-section"><div class="container py-5">
    <a class="btn btn-outline-dark mb-4" th:href="@{/admin/users}"><i class="bi bi-arrow-left me-2"></i><span th:text="#{admin.users.back}">Назад</span></a>
    <div th:if="${userUpdated}" class="alert alert-success" th:text="#{admin.users.updated}">Обновен.</div>
    <form class="product-editor" method="post" th:action="@{/admin/users/{id}(id=${userId})}" th:object="${user}" novalidate>
        <div class="product-editor-card tilt-card">
            <div class="editor-card-heading"><div class="editor-card-icon"><i class="bi bi-person-gear"></i></div><div><h1 class="h3" th:text="#{admin.users.edit}">Редакция на профил</h1></div></div>
            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" th:text="#{form.correctErrors}"></div>
            <div class="row g-3">
                <div class="col-md-6 form-group-custom"><label for="adminFirstName" th:text="#{form.firstName}">Име</label><input id="adminFirstName" class="form-control" th:errorclass="is-invalid" th:field="*{firstName}" maxlength="50"><div class="invalid-feedback d-block" th:errors="*{firstName}"></div></div>
                <div class="col-md-6 form-group-custom"><label for="adminLastName" th:text="#{form.lastName}">Фамилия</label><input id="adminLastName" class="form-control" th:errorclass="is-invalid" th:field="*{lastName}" maxlength="50"><div class="invalid-feedback d-block" th:errors="*{lastName}"></div></div>
                <div class="col-md-6 form-group-custom"><label for="adminEmail" th:text="#{form.email}">Email</label><input id="adminEmail" type="email" class="form-control" th:errorclass="is-invalid" th:field="*{email}" maxlength="254"><div class="invalid-feedback d-block" th:errors="*{email}"></div></div>
                <div class="col-md-6 form-group-custom"><label for="adminPhone" th:text="#{form.phone}">Телефон</label><input id="adminPhone" type="tel" class="form-control" th:errorclass="is-invalid" th:field="*{phoneNumber}" maxlength="20"><div class="invalid-feedback d-block" th:errors="*{phoneNumber}"></div></div>
                <div class="col-md-6 form-group-custom"><label for="adminRole" th:text="#{admin.users.role}">Роля</label><select id="adminRole" class="form-select" th:field="*{role}"><option th:each="roleOption : ${roles}" th:value="${roleOption}" th:text="${roleOption.name() == 'ADMIN'} ? #{role.ADMIN} : (${roleOption.name() == 'MODERATOR'} ? #{role.MODERATOR} : #{role.USER})"></option></select></div>
                <div class="col-md-6 form-group-custom"><label for="adminDiscount" th:text="#{admin.users.discountPercent}">Отстъпка (%)</label><input id="adminDiscount" type="number" class="form-control" th:errorclass="is-invalid" th:field="*{discountPercent}" min="0" max="100" step="0.01"><div class="invalid-feedback d-block" th:errors="*{discountPercent}"></div></div>
                <div class="col-12 form-group-custom"><label for="adminPassword" th:text="#{admin.users.newPassword}">Нова парола</label><input id="adminPassword" type="password" class="form-control" th:errorclass="is-invalid" th:field="*{newPassword}" minlength="8" maxlength="72" autocomplete="new-password"><div class="form-hint" th:text="#{admin.users.passwordHint}">Оставете празно без промяна.</div><div class="invalid-feedback d-block" th:errors="*{newPassword}"></div></div>
                <div class="col-12 form-check form-switch mb-4"><input id="adminBlocked" class="form-check-input" type="checkbox" th:field="*{blocked}"><label class="form-check-label" for="adminBlocked" th:text="#{admin.users.blockUser}">Блокиран профил</label></div>
            </div>
            <button class="btn btn-orange" type="submit"><i class="bi bi-check-lg me-2"></i><span th:text="#{admin.users.save}">Запази</span></button>
        </div>
    </form>
</div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
