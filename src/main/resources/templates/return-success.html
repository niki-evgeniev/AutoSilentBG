<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="5;url=/">
    <title th:text="#{return.success.title}">Заявката е изпратена - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="product-form-page page-3d">
    <section class="product-form-section min-vh-100 d-flex align-items-center">
        <div class="container">
            <div class="product-editor-card tilt-card text-center mx-auto" style="max-width: 720px;">
                <i class="bi bi-check-circle-fill text-success display-1"></i>
                <h1 class="mt-4" th:text="#{return.success.heading}">Заявката ви беше изпратена успешно.</h1>
                <p th:text="#{return.success.text}">Ще се свържем с вас след преглед.</p>
                <p th:text="#{return.success.redirect}">След 5 секунди ще бъдете пренасочени.</p>
                <a class="btn btn-orange mt-3" th:href="@{/}" th:text="#{contact.success.home}">Към началната
                    страница</a>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>window.setTimeout(() => window.location.replace('/'), 5000);</script>
</body>
</html>
