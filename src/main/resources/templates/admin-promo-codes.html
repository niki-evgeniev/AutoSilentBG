<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.promoCodes.title}">Промокодове - NiRTON.bg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="admin-orders-page">
    <section class="container py-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb custom-breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{site.home}">Начало</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="#{admin.promoCodes.heading}">Промокодове</li>
            </ol>
        </nav>

        <div class="section-title text-start">
            <span th:text="#{site.settings}">Настройки</span>
            <h1 th:text="#{admin.promoCodes.heading}">Промокодове</h1>
        </div>

        <div th:if="${promoCodeCreated}" class="alert alert-success" th:text="#{admin.promoCodes.created}">Промокодът е добавен.</div>

        <div class="admin-order-grid">
            <section class="admin-detail-card">
                <h2 th:text="#{admin.promoCodes.add}">Добави промокод</h2>
                <form method="post" th:action="@{/admin/settings/promo-codes}" th:object="${promoCode}" novalidate>
                    <div class="form-group-custom mb-3">
                        <label for="promoCodeInput" th:text="#{admin.promoCodes.code}">Промокод</label>
                        <input id="promoCodeInput" class="form-control" th:errorclass="is-invalid"
                               th:field="*{code}" maxlength="40" autocomplete="off">
                        <div class="invalid-feedback d-block" th:errors="*{code}"></div>
                    </div>
                    <div class="form-group-custom mb-3">
                        <label for="promoDiscount" th:text="#{admin.promoCodes.discount}">Отстъпка</label>
                        <select id="promoDiscount" class="form-select" th:errorclass="is-invalid"
                                th:field="*{discountPercent}">
                            <option value="" th:text="#{admin.promoCodes.chooseDiscount}">Избери отстъпка</option>
                            <option th:each="discount : ${allowedDiscounts}"
                                    th:value="${discount}"
                                    th:text="|${discount}%|"></option>
                        </select>
                        <div class="invalid-feedback d-block" th:errors="*{discountPercent}"></div>
                    </div>
                    <button class="btn btn-orange w-100" type="submit" th:text="#{admin.promoCodes.save}">Запази</button>
                </form>
            </section>

            <section class="admin-detail-card">
                <h2 th:text="#{admin.promoCodes.list}">Добавени промокодове</h2>
                <div class="table-responsive" th:if="${!promoCodes.isEmpty()}">
                    <table class="table align-middle admin-orders-table">
                        <thead>
                        <tr>
                            <th th:text="#{admin.promoCodes.code}">Код</th>
                            <th th:text="#{admin.promoCodes.discount}">Отстъпка</th>
                            <th th:text="#{admin.promoCodes.createdBy}">Добавен от</th>
                            <th th:text="#{admin.promoCodes.createdAt}">Дата</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="code : ${promoCodes}">
                            <td><strong th:text="${code.code()}">CODE</strong></td>
                            <td th:text="|${code.discountPercent()}%|">10%</td>
                            <td th:text="${code.createdBy()}">admin@example.com</td>
                            <td th:text="${#temporals.format(code.createdAt(), 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="cart-empty" th:if="${promoCodes.isEmpty()}">
                    <i class="bi bi-ticket-perforated"></i>
                    <h2 th:text="#{admin.promoCodes.empty}">Няма добавени промокодове</h2>
                </div>
            </section>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
