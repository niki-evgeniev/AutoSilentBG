<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.ipAddresses.title}">IP адреси - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body th:data-currency="#{site.currency}">
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page">
    <section class="container py-5">
        <div class="section-title text-start">
            <span th:text="#{admin.ipAddresses.eyebrow}">Сигурност</span>
            <h1 th:text="#{admin.ipAddresses.heading}">Посетили IP адреси</h1>
        </div>

        <div class="alert alert-success" th:if="${ipBanUpdated}"
             th:text="#{admin.ipAddresses.updated}">Статусът на адреса е обновен.</div>

        <div class="admin-table-card admin-ip-addresses-card">
            <div class="table-responsive ip-addresses-table-wrapper" th:if="${!addresses.isEmpty()}">
                <table class="table align-middle admin-orders-table ip-addresses-table">
                    <thead>
                    <tr>
                        <th th:text="#{admin.ipAddresses.id}">ID</th>
                        <th th:text="#{admin.ipAddresses.address}">IP адрес</th>
                        <th th:text="#{admin.ipAddresses.firstSeen}">Добавен</th>
                        <th th:text="#{admin.ipAddresses.lastSeen}">Последно видян</th>
                        <th th:text="#{admin.ipAddresses.visits}">Посещения</th>
                        <th th:text="#{admin.ipAddresses.status}">Статус</th>
                        <th th:text="#{admin.ipAddresses.bannedUntil}">Баннат до</th>
                        <th th:text="#{admin.ipAddresses.actions}">Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="address : ${addresses.content}">
                        <td th:attr="data-label=#{admin.ipAddresses.id}">
                            <strong th:text="${address.id()}"></strong>
                        </td>
                        <td th:attr="data-label=#{admin.ipAddresses.address}">
                            <div>
                                <strong th:text="${address.address()}"></strong>
                                <small class="d-block text-muted" th:if="${address.userEmail() != null}"
                                       th:text="${address.userEmail()}"></small>
                            </div>
                        </td>
                        <td th:attr="data-label=#{admin.ipAddresses.firstSeen}"
                            th:text="${#temporals.format(address.firstSeen(), 'dd.MM.yyyy HH:mm:ss')}"></td>
                        <td th:attr="data-label=#{admin.ipAddresses.lastSeen}"
                            th:text="${#temporals.format(address.lastSeen(), 'dd.MM.yyyy HH:mm:ss')}"></td>
                        <td th:attr="data-label=#{admin.ipAddresses.visits}">
                            <strong th:text="${address.countVisits()}"></strong>
                        </td>
                        <td th:attr="data-label=#{admin.ipAddresses.status}">
                            <span class="order-status status-returned" th:if="${address.banned()}"
                                  th:text="#{admin.ipAddresses.banned}">Баннат</span>
                            <span class="order-status status-delivered" th:unless="${address.banned()}"
                                  th:text="#{admin.ipAddresses.allowed}">Разрешен</span>
                        </td>
                        <td th:attr="data-label=#{admin.ipAddresses.bannedUntil}">
                            <span th:if="${address.banned() && address.bannedUntil() == null}"
                                  th:text="#{admin.ipAddresses.forever}">Завинаги</span>
                            <span th:if="${address.bannedUntil() != null}"
                                  th:text="${#temporals.format(address.bannedUntil(), 'dd.MM.yyyy HH:mm')}"></span>
                            <span th:unless="${address.banned()}" aria-hidden="true">—</span>
                        </td>
                        <td th:attr="data-label=#{admin.ipAddresses.actions}">
                            <div class="ip-ban-actions" th:unless="${address.banned()}">
                                <form th:action="@{/admin/ip-addresses/{id}/ban/temporary(id=${address.id()})}" method="post">
                                    <input name="page" type="hidden" th:value="${addresses.number}">
                                    <label class="visually-hidden" th:for="|banDays-${address.id()}|"
                                           th:text="#{admin.ipAddresses.days}">Дни</label>
                                    <input class="form-control form-control-sm" th:id="|banDays-${address.id()}|"
                                           name="days" type="number" min="1" max="3650" value="7" required>
                                    <button class="btn btn-sm btn-outline-danger" type="submit"
                                            th:text="#{admin.ipAddresses.banForDays}">Бан за дни</button>
                                </form>
                                <form th:action="@{/admin/ip-addresses/{id}/ban/permanent(id=${address.id()})}" method="post">
                                    <input name="page" type="hidden" th:value="${addresses.number}">
                                    <button class="btn btn-sm btn-danger" type="submit"
                                            th:text="#{admin.ipAddresses.banForever}">Бан завинаги</button>
                                </form>
                            </div>
                            <form th:if="${address.banned()}"
                                  th:action="@{/admin/ip-addresses/{id}/unban(id=${address.id()})}" method="post">
                                <input name="page" type="hidden" th:value="${addresses.number}">
                                <button class="btn btn-sm btn-outline-success" type="submit"
                                        th:text="#{admin.ipAddresses.unban}">Премахни бан</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="cart-empty" th:if="${addresses.isEmpty()}">
                <i class="bi bi-shield-check"></i>
                <h2 th:text="#{admin.ipAddresses.empty}">Все още няма записани адреси</h2>
            </div>

            <nav class="mt-4" th:if="${addresses.totalPages > 1}" th:aria-label="#{admin.ipAddresses.pagination}">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${addresses.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/ip-addresses(page=0)}"
                           th:text="#{admin.ipAddresses.first}">Първа</a>
                    </li>
                    <li class="page-item" th:classappend="${addresses.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/ip-addresses(page=${addresses.number - 1})}"
                           th:text="#{admin.ipAddresses.previous}">Назад</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="|${addresses.number + 1} / ${addresses.totalPages}|"></span>
                    </li>
                    <li class="page-item" th:classappend="${addresses.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/ip-addresses(page=${addresses.number + 1})}"
                           th:text="#{admin.ipAddresses.next}">Напред</a>
                    </li>
                    <li class="page-item" th:classappend="${addresses.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/ip-addresses(page=${addresses.totalPages - 1})}"
                           th:text="#{admin.ipAddresses.last}">Последна</a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
