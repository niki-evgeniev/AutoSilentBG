<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
    <title th:text="#{econt.admin.title}">Еконт — населени места и офиси</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div><div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <h1 class="h3 mb-4" th:text="#{econt.admin.title}">Еконт — населени места и офиси</h1>
    <section class="admin-detail-card">
        <p th:text="#{econt.admin.explanation}">Списъците се обновяват автоматично всяка нощ. При неуспешно обновяване се запазват последните данни.</p>
        <p><strong th:text="#{econt.admin.lastSuccess}">Последно успешно обновяване:</strong>
            <span th:text="${sync.lastSuccess != null ? #temporals.format(sync.lastSuccess, 'dd.MM.yyyy HH:mm') : #messages.msg('econt.admin.never')}"></span></p>
        <p class="alert alert-warning" th:if="${sync.lastError != null}" th:text="${sync.lastError}"></p>
        <p class="alert" th:if="${syncOk != null}" th:classappend="${syncOk ? 'alert-success' : 'alert-danger'}"
           th:text="${syncOk ? #messages.msg('econt.admin.success') : #messages.msg('econt.admin.failed')}"></p>
        <form th:action="@{/admin/settings/econt/refresh}" method="post">
            <button class="btn btn-orange" type="submit" th:text="#{econt.admin.refresh}">Обнови офисите</button>
        </form>
    </section>
    <a class="btn btn-outline-dark mt-4" th:href="@{/admin/orders}" th:text="#{admin.orders}">Поръчки</a>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/shop.js"></script>
</body></html>
