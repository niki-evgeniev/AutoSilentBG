<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="top-bar d-none d-md-block" th:fragment="topBar">
    <div class="container d-flex justify-content-between align-items-center">
        <span><i class="bi bi-truck me-1"></i> <span th:text="#{site.freeDelivery}">Безплатна доставка над 99 €</span></span>
        <div class="top-links">
            <!--            <a href="#">Помощ и контакти</a>-->
            <a href="tel:0888123456">
                <i class="bi bi-telephone me-1"></i>
                0888 123 456</a>
            <a sec:authorize="isAnonymous()"
               th:href="@{/user/sign_in}">
                <i class="bi bi-person me-1"></i> <span
                    th:text="#{site.login}">Вход</span>
            </a>
            <a sec:authorize="isAnonymous()"
               th:href="@{/user/sign_up}">
                <i class="bi bi-person-plus me-1"></i>
                <span th:text="#{site.register}">Регистрация</span>
            </a>

            <span sec:authorize="isAuthenticated()">
                <i class="bi bi-person-check me-1"></i>
                <span th:text="#{site.greeting}">Здравей,
                </span> <span sec:authentication="principal.firstName"></span>
            </span>
            <div sec:authorize="hasAnyRole('ADMIN', 'MODERATOR')" class="dropdown top-settings-dropdown">
                <button class="top-link-button dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                    <i class="bi bi-gear me-1"></i>
                    <span th:text="#{site.settings}">Настройки</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" th:href="@{/products/add}">
                            <i class="bi bi-plus-circle me-2"></i>
                            <span th:text="#{site.addProduct}">Добави продукт</span>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/admin/orders}">
                            <i class="bi bi-receipt me-2"></i>
                            <span th:text="#{admin.orders}">Поръчки</span>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/admin/inquiries}">
                            <i class="bi bi-envelope-paper me-2"></i>
                            <span th:text="#{admin.inquiries}">Запитвания</span>
                        </a>
                    </li>
                    <li sec:authorize="hasRole('ADMIN')">
                        <a class="dropdown-item" th:href="@{/admin/ip-addresses}">
                            <i class="bi bi-shield-lock me-2"></i>
                            <span th:text="#{admin.ipAddresses}">Адреси</span>
                        </a>
                    </li>
                </ul>
            </div>
            <form sec:authorize="isAuthenticated()"
                  th:action="@{/users/logout}" method="post">
                <button type="submit" class="top-link-button">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    <span th:text="#{site.logout}">Изход</span>
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
