<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<header class="main-header header-3d sticky-top" th:fragment="header">
    <div class="header-glow" aria-hidden="true"></div>
    <nav class="navbar navbar-expand-lg header-3d-nav">
        <div class="container">
            <a class="navbar-brand logo logo-3d tilt-card"
               th:href="@{/}"><span>Auto</span>Silent</a>
<!--            <a class="navbar-brand logo logo-3d tilt-card" th:href="@{/}"><span>N</span>iRTON</a>-->

            <button class="navbar-toggler border-0"
                    type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
                    <li class="nav-item"><a
                            class="nav-link"
                            data-nav="home"
                            th:href="@{/}"
                            th:text="#{site.home}">Начало</a></li>
                    <li class="nav-item"><a
                            class="nav-link"
                            data-nav="products"
                            th:href="@{/products}"
                            th:text="#{site.categories}">Продукти</a></li>
                    <li class="nav-item"><a
                            class="nav-link"
                            data-nav="promo"
                            th:href="@{/#promo}"
                            th:text="#{site.promotions}">Промоции</a></li>
                    <li class="nav-item"><a
                            class="nav-link"
                            data-nav="new-products"
                            th:href="@{/#products}"
                            th:text="#{site.newProducts}">Нови продукти</a></li>
                    <li class="nav-item"><a
                            class="nav-link"
                            data-nav="contacts" th:href="@{/contact}"
                            th:text="#{site.contacts}">Контакти</a></li>
                </ul>

                <div class="header-actions d-flex align-items-center gap-3">
                    <div class="language-switch" th:aria-label="#{site.language}">
                        <a href="?lang=bg" th:classappend="${#locale.language == 'bg'} ? 'active'"
                           th:text="#{site.bulgarian}">БГ</a>
                        <a href="?lang=en" th:classappend="${#locale.language == 'en'} ? 'active'"
                           th:text="#{site.english}">EN</a>
                    </div>
                    <a sec:authorize="isAuthenticated()" class="icon-btn header-action-3d tilt-card"
                       th:href="@{/user/account}" th:aria-label="#{site.profile}"><i class="bi bi-person-check"></i></a>
                    <a sec:authorize="hasRole('ADMIN')" class="icon-btn header-action-3d tilt-card"
                       th:href="@{/admin/settings/categories}" th:aria-label="#{site.settings}"><i class="bi bi-gear"></i></a>
                    <a sec:authorize="isAnonymous()" class="icon-btn header-action-3d tilt-card"
                       th:href="@{/user/sign_in}" th:aria-label="#{site.login}"><i class="bi bi-person"></i></a>
                    <a sec:authorize="isAuthenticated()" class="icon-btn header-action-3d tilt-card position-relative"
                       th:href="@{/favorites}" th:aria-label="#{favorites.title}">
                        <i class="bi bi-heart-fill"></i>
                        <span th:if="${favoriteProductIds != null and !favoriteProductIds.isEmpty()}"
                              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:text="${favoriteProductIds.size()}">0</span>
                    </a>
                </div>
            </div>

            <div class="header-commerce-row">
                <form class="header-search header-search-persistent" th:action="@{/products}" method="get" role="search">
                    <label class="visually-hidden" for="headerSearch" th:text="#{site.search}">Търси</label>
                    <input id="headerSearch" name="search" type="search" maxlength="150"
                           th:value="${search}" th:placeholder="#{products.search.placeholder}">
                    <button class="icon-btn header-action-3d" type="submit" th:aria-label="#{site.search}">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
                <a class="cart-btn header-cart-persistent" th:href="@{/cart}" th:aria-label="#{cart.title}">
                    <i class="bi bi-cart3 me-2"></i>
                    <span class="cart-count">0</span>
                    <span class="cart-total" th:text="#{site.cartTotal}">0.00 €</span>
                </a>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
