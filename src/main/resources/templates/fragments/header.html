<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<header class="main-header header-3d sticky-top" th:fragment="header">
    <div class="header-glow" aria-hidden="true"></div>
    <nav class="navbar navbar-expand-lg header-3d-nav">
        <div class="container">
            <a class="navbar-brand logo logo-3d tilt-card" th:href="@{/}"><span>N</span>iRTON</a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
                    <li class="nav-item"><a class="nav-link active" th:href="@{/}" th:text="#{site.home}">Начало</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products}" th:text="#{site.categories}">Категории</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/#promo}" th:text="#{site.promotions}">Промоции</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/#products}" th:text="#{site.newProducts}">Нови продукти</a></li>
                    <li class="nav-item"><a class="nav-link" href="#footer" th:text="#{site.contacts}">Контакти</a></li>
                </ul>

                <div class="header-actions d-flex align-items-center gap-3">
                    <div class="language-switch" th:aria-label="#{site.language}">
                        <a href="?lang=bg" th:classappend="${#locale.language == 'bg'} ? 'active'" th:text="#{site.bulgarian}">БГ</a>
                        <a href="?lang=en" th:classappend="${#locale.language == 'en'} ? 'active'" th:text="#{site.english}">EN</a>
                    </div>
                    <button class="icon-btn header-action-3d tilt-card" th:aria-label="#{site.search}"><i class="bi bi-search"></i></button>
                    <button class="icon-btn header-action-3d tilt-card" th:aria-label="#{site.profile}"><i class="bi bi-person"></i></button>
                    <button class="cart-btn"><i class="bi bi-cart3 me-2"></i> <span th:text="#{site.cartTotal}">0.00 лв.</span></button>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
