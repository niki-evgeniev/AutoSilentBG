<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Китове - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="shop-page page-3d">
    <section class="container py-5">
        <nav aria-label="breadcrumb"><ol class="breadcrumb custom-breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Начало</a></li><li class="breadcrumb-item active">Китове</li>
        </ol></nav>
        <div class="section-title text-start"><span>AutoSilent</span><h1>Китове</h1>
            <p>Готови комплекти от продукти за шумоизолация.</p></div>
        <div class="row g-4" th:if="${!kits.empty}">
            <div class="col-12 col-sm-6 col-xl-4" th:each="kit : ${kits.content}">
                <article class="product-card shop-product-card tilt-card">
                    <a class="product-image" th:href="@{/shumoizolaciya/kit/{url}(url=${kit.url})}">
                        <img th:if="${kit.mainImageUrl() != null}" th:src="${kit.mainImageUrl()}" th:alt="${kit.displayName()}">
                        <i th:if="${kit.mainImageUrl() == null}" class="bi bi-boxes product-placeholder-icon"></i>
                    </a>
                    <div class="product-content text-center"><div class="product-meta"><span>Кит</span></div>
                        <h3><a class="product-name-link" th:href="@{/shumoizolaciya/kit/{url}(url=${kit.url})}" th:text="${kit.displayName}">Кит</a></h3>
                        <p class="product-card-description" th:text="${kit.plainDescription()}"></p>
                        <div class="price" th:text="|Цена: ${kit.price} €|"></div>
                        <a class="btn btn-orange" th:href="@{/shumoizolaciya/kit/{url}(url=${kit.url})}">Виж повече</a>
                    </div>
                </article>
            </div>
        </div>
        <p th:if="${kits.empty}">Все още няма добавени китове.</p>
        <nav class="shop-pagination mt-4" th:if="${kits.totalPages > 1}">
            <a th:each="index : ${#numbers.sequence(0, kits.totalPages - 1)}" th:href="@{/shumoizolaciya/kit(page=${index})}"
               th:classappend="${index == kits.number} ? ' active'" th:text="${index + 1}"></a>
        </nav>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body></html>
