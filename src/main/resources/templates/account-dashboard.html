<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="#{account.title}">Моят акаунт - AutoSilent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="auth-page page-3d profile-page">
    <div class="container py-5">
        <div class="section-title text-center mb-5">
            <span th:text="#{account.eyebrow}">Моят профил</span>
            <h1 th:text="#{account.heading}">Моят акаунт</h1>
            <p th:text="#{account.intro}">Управлявайте данните, поръчките и адресите си.</p>
        </div>
        <div class="row g-4 justify-content-center">
            <div class="col-md-6 col-lg-4">
                <a class="auth-form-card auth-3d-card tilt-card d-block h-100 text-center text-decoration-none"
                   th:href="@{/user/profile}">
                    <i class="bi bi-person-circle display-3"></i>
                    <h2 class="h4 mt-3" th:text="#{account.profile}">Профил</h2>
                    <p th:text="#{account.profile.text}">Редактирайте личните си данни.</p>
                </a>
            </div>
            <div class="col-md-6 col-lg-4">
                <a class="auth-form-card auth-3d-card tilt-card d-block h-100 text-center text-decoration-none"
                   th:href="@{/user/orders}">
                    <i class="bi bi-box-seam display-3"></i>
                    <h2 class="h4 mt-3" th:text="#{account.orders}">Поръчки</h2>
                    <p th:text="#{account.orders.text}">Прегледайте историята на поръчките.</p>
                </a>
            </div>
            <div class="col-md-6 col-lg-4">
                <a class="auth-form-card auth-3d-card tilt-card d-block h-100 text-center text-decoration-none"
                   th:href="@{/user/addresses}">
                    <i class="bi bi-geo-alt display-3"></i>
                    <h2 class="h4 mt-3" th:text="#{account.addresses}">Адреси за поръчки</h2>
                    <p th:text="#{account.addresses.text}">Управлявайте адресите си за доставка.</p>
                </a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
