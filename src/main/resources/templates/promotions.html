<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|#{promotion.heading} - AutoSilent|">Промоции - AutoSilent</title>
    <meta name="description" th:content="#{promotion.description}">
    <link rel="canonical" th:href="${canonical}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" th:href="@{/css/shop.css}" rel="stylesheet">
</head>
<body th:data-currency="#{site.currency}" th:data-cart-added="#{product.added}">
<div th:replace="~{fragments/top-bar :: topBar}"></div><div th:replace="~{fragments/header :: header}"></div>
<main class="products-page page-3d">
    <section th:replace="~{fragments/promotions-hero :: hero}"></section>
    <section class="products-page-section"><div class="container">
    <p class="alert alert-info" th:text="#{promotion.noDiscounts}"></p>
    <form class="row g-3 mb-4" th:action="@{/promocii}" method="get">
        <input type="hidden" name="search" th:value="${search}">
        <div class="col-md-4"><label for="offerOrder" class="form-label" th:text="#{promotion.sort}"></label>
            <select id="offerOrder" name="order" class="form-select">
                <option value="newest" th:selected="${sortMode == 'newest'}" th:text="#{promotion.newest}"></option>
                <option value="priceAsc" th:selected="${sortMode == 'priceAsc'}" th:text="#{promotion.priceAsc}"></option>
                <option value="priceDesc" th:selected="${sortMode == 'priceDesc'}" th:text="#{promotion.priceDesc}"></option>
            </select></div>
        <div class="col-md-3 d-flex align-items-end"><button class="btn btn-orange" type="submit" th:text="#{site.search}"></button></div>
        <div class="col-12"><label><input type="checkbox" name="inStock" value="true" th:checked="${inStock}"> <span th:text="#{products.inStock}"></span></label></div>
    </form>
    <div class="row g-4"><div class="col-12 col-sm-6 col-xl-4" th:each="product : ${products}">
        <article th:replace="~{fragments/catalog-card :: card(${product}, true)}"></article>
    </div></div>
    <p th:if="${products.isEmpty()}" class="cart-empty" th:text="#{promotion.empty}"></p>
    <nav th:if="${pages > 1}" class="d-flex flex-wrap gap-2 mt-4" th:aria-label="#{promotion.pages}">
        <a th:each="p : ${#numbers.sequence(0, pages - 1)}" class="btn btn-outline-dark"
           th:classappend="${p == page} ? 'active'" th:href="@{/promocii(page=${p},search=${search},inStock=${inStock},order=${sortMode})}" th:text="${p + 1}"></a>
    </nav>
    </div></section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js" th:src="@{/js/shop.js}"></script>
</body></html>
