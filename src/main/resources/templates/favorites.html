<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="#{favorites.meta}">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="#{favorites.title}">Любими продукти - NiRTON.bg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
</head>
<body th:data-cart-added="#{product.added}" th:data-currency="#{site.currency}">
<div th:replace="~{fragments/top-bar :: topBar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <section class="shop-hero-small page-3d-hero">
        <div class="container">
            <span class="eyebrow"><i class="bi bi-heart-fill me-2"></i><span th:text="#{favorites.eyebrow}">Моят списък</span></span>
            <h1 th:text="#{favorites.heading}">Любими продукти</h1>
            <p th:text="#{favorites.intro}">Запазените от вас продукти.</p>
        </div>
    </section>
    <section class="products-page-section">
        <div class="container">
            <div class="row g-4" th:if="${!products.isEmpty()}">
                <div class="col-12 col-sm-6 col-lg-4 col-xl-3" th:each="product : ${products}">
                    <article class="product-card shop-product-card tilt-card"
                             th:data-product-id="${product.id()}" th:data-product-name="${product.name()}"
                             th:data-product-price="${product.price()}" th:data-product-image="${product.mainImageUrl()}"
                             th:data-product-url="@{/products/{id}(id=${product.id()})}">
                        <form method="post" th:action="@{/favorites/{id}/toggle(id=${product.id()})}">
                            <input type="hidden" name="source" value="favorites">
                            <button type="submit" class="wishlist-btn" th:aria-label="#{favorites.remove}">
                                <i class="bi bi-heart-fill text-danger"></i>
                            </button>
                        </form>
                        <div class="product-image">
                            <img th:if="${product.mainImageUrl() != null}" th:src="${product.mainImageUrl()}" th:alt="${product.name()}">
                            <i th:unless="${product.mainImageUrl() != null}" class="bi bi-box-seam product-placeholder-icon"></i>
                        </div>
                        <div class="product-content">
                            <div class="product-meta"><span th:text="${product.category()}">Категория</span><span th:text="${product.sku()}">Код</span></div>
                            <h3 class="text-center"><a class="product-name-link" th:href="@{/products/{id}(id=${product.id()})}" th:text="${product.name()}">Продукт</a></h3>
                            <p class="product-card-description" th:text="${product.description()}">Описание</p>
                            <div class="price" th:text="#{product.price(${product.price()})}">0.00 €</div>
                            <div class="product-card-actions">
                                <a class="btn btn-outline-dark custom-outline" th:href="@{/products/{id}(id=${product.id()})}" th:text="#{products.more}">Виж повече</a>
                                <button class="btn btn-orange add-cart" th:disabled="${product.stock() == 0}"><i class="bi bi-cart-plus"></i></button>
                            </div>
                        </div>
                    </article>
                </div>
            </div>
            <div class="alert alert-light text-center py-5" th:if="${products.isEmpty()}">
                <i class="bi bi-heart display-5 d-block mb-3"></i>
                <h2 class="h4" th:text="#{favorites.empty}">Нямате любими продукти.</h2>
                <a class="btn btn-orange mt-3" th:href="@{/products}" th:text="#{favorites.browse}">Разгледай продуктите</a>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
