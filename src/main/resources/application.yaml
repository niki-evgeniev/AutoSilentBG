spring:
  profiles:
    default: dev
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 55MB
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

AutoSilent:
  security:
    rate-limit:
      enabled: true
      max-requests: 120
      window: 1m
      ban-duration: 15m

server:
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB
    max-part-count: 500
